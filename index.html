<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>BeTa of Fish</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
  body{background:#0a0a0a;color:#ffebee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden;touch-action:none}
  h1{font-size:1.25rem;margin:6px 0 4px;color:#ff1744;text-shadow:0 0 12px rgba(255,23,68,0.55);letter-spacing:0.5px}
  #topInfo{display:flex;gap:7px;font-size:.78rem;margin-bottom:4px;flex-wrap:wrap;justify-content:center}
  #topInfo div{background:rgba(40,0,0,0.75);border:1px solid #b71c1c;padding:4px 8px;border-radius:8px;color:#ffcdd2}
  input{user-select:text;-webkit-user-select:text}
  canvas{background:linear-gradient(#2b0000,#0a0a0a);border-radius:12px;border:3px solid #c62828;max-width:96vw;display:block;box-shadow:0 0 18px rgba(198,40,40,0.35)}
  .btn-row{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;justify-content:center;padding:0 3px}
  .btn{background:linear-gradient(180deg,#c62828,#7f0000);border:1px solid #ff5252;border-radius:9px;color:#fff;font-size:.8rem;font-weight:bold;padding:8px 10px;min-width:64px;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
  .btn:active{transform:scale(.95);filter:brightness(1.15)}
  #castBtn{background:linear-gradient(180deg,#ff1744,#b71c1c);min-width:90px;border-color:#ff8a80}
  #castBtn:disabled{background:#333;border-color:#555;color:#888}
  #locationBtn{background:linear-gradient(180deg,#d32f2f,#6a0000)}
  #shopBtn{background:linear-gradient(180deg,#ff5252,#c62828);color:#fff}
  #questBtn{background:linear-gradient(180deg,#e53935,#8e0000)}
  #bookBtn{background:linear-gradient(180deg,#b71c1c,#4a0000)}
  #statBtn{background:linear-gradient(180deg,#424242,#1a1a1a);border-color:#757575}
  #craftBtn{background:linear-gradient(180deg,#6d1b1b,#2a0000)}
  #invBtn{background:linear-gradient(180deg,#c62828,#5d0000)!important}
  #settingsBtn{background:linear-gradient(180deg,#37474f,#102027)!important;border:1px solid #78909c}
  #panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,0,0,.94);z-index:58;padding:0 12px 0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  body:has(#panel[style*="display: block"]) :is(#mpBtn,#userBar,#megaTimer){display:none!important}
  #panelHead{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px;background:rgba(14,0,0,.98);border-bottom:1px solid #5d1010;margin:0 -12px;padding:0 12px}
  #panelHead h2{margin:0!important;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #closeX{flex:none;background:linear-gradient(180deg,#ff1744,#9a0007);border:1px solid #ff8a80;color:#fff;border-radius:18px;padding:7px 14px;font-size:.9rem;font-weight:bold}
  #panelContent .tabsbar{position:sticky;top:48px;z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;margin:0 -12px 6px;background:rgba(14,0,0,.97);border-bottom:1px solid #3a0a0a;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #panelContent .tabsbar::-webkit-scrollbar{display:none}
  #panelContent .tabchip{flex:none;border:1px solid #7f1d1d;background:#2a0a0a;color:#ffcdd2;border-radius:16px;padding:6px 12px;font-size:.82rem;white-space:nowrap}
  #panelContent .tabchip.on{background:linear-gradient(180deg,#ff1744,#b71c1c);border-color:#ff8a80;color:#fff;font-weight:bold;box-shadow:0 0 8px rgba(255,23,68,.5)}
  #panelContent .slotgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:4px 0}
  #panelContent .slotgrid>.item{margin:0;flex-direction:column;align-items:stretch;justify-content:space-between;text-align:center;gap:6px;padding:8px 6px;min-height:78px}
  #panelContent .slotgrid>.item>*{max-width:100%}
  #panelContent .slotgrid>.item button{width:100%}
  #panelContent .slotgrid>.item .item-info{word-break:break-word}
  #panelContent .grp .section-title{display:none}
  #panel .closeBtn{position:sticky;bottom:0;z-index:5;margin:10px 0 0;box-shadow:0 -6px 12px rgba(8,0,0,.9)}
  #mpPanel>div:first-child{position:sticky;top:0;z-index:3;background:rgba(8,20,36,.99);padding:4px 0}
  #panel h2{margin-bottom:8px;font-size:1.15rem;color:#ff1744;text-shadow:0 0 8px rgba(255,23,68,0.4)}
  .section-title{margin:12px 0 6px;font-size:.95rem;color:#ff8a80;border-left:3px solid #ff1744;padding-left:8px}
  .item{background:linear-gradient(90deg,#1a0505,#2a0a0a);margin:4px 0;padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:5px;border:1px solid #5d1010}
  .item-info{flex:1}
  .item-name{font-weight:bold;font-size:.9rem;color:#ffebee}
  .item-sub{font-size:.75rem;color:#ef9a9a}
  .buy-btn,.sell-btn,.equip-btn,.claim-btn{border:none;border-radius:6px;padding:5px 9px;font-size:.75rem;font-weight:bold;white-space:nowrap}
  .buy-btn{background:#c62828;color:#fff}
  .sell-btn{background:#ff6f00;color:#fff}
  .equip-btn{background:#424242;color:#fff;border:1px solid #e0e0e0}
  .claim-btn{background:#d50000;color:#fff}
  .claim-btn:disabled{background:#333;color:#777}
  .closeBtn{background:linear-gradient(180deg,#ff1744,#9a0007);border:1px solid #ff8a80;color:#fff;padding:10px;border-radius:8px;margin-top:12px;font-size:.95rem;width:100%;font-weight:bold}
  #message{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(20,0,0,.9);padding:10px 14px;border-radius:9px;font-size:.95rem;display:none;z-index:5;text-align:center;border:1px solid #ff1744;color:#ffebee;box-shadow:0 0 20px rgba(255,23,68,0.35)}
  #weatherInfo{font-size:.8rem;color:#ef9a9a;margin-bottom:3px}
  #fishingUI{display:none;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:90%;max-width:310px;z-index:8;text-align:center}
  #biteText{font-size:1.1rem;font-weight:bold;color:#ff1744;margin-bottom:6px;text-shadow:0 0 8px #000,0 0 12px #ff1744}
  #reelBarBg{position:relative;background:#1a1a1a;height:18px;border-radius:10px;overflow:visible;border:2px solid #ff5252;margin-top:8px;box-shadow:0 0 10px rgba(255,23,68,0.25)}
  #reelBar{background:linear-gradient(90deg,#b71c1c,#ff1744,#ff8a80);height:100%;width:0%;transition:width .08s linear;border-radius:8px}
  #skillFxLayer{position:absolute;left:0;top:-28px;width:100%;height:28px;pointer-events:none;overflow:visible;text-align:center;font-size:1.1rem;font-weight:bold;text-shadow:0 0 8px #000}
  #reelBarBg.fx-prism{box-shadow:0 0 20px 6px #ff80ab,0 0 40px 10px #40c4ff,0 0 60px #ffee58;border-color:#fff;animation:tridentFlash .3s ease}
  #reelBarBg.fx-prism #reelBar{background:linear-gradient(90deg,#ff1744,#ff9100,#ffea00,#00e676,#00b0ff,#7c4dff,#f50057)}
  #reelBarBg.fx-hammer{box-shadow:0 0 18px 6px #29b6f6,0 0 40px #01579b;border-color:#81d4fa;animation:hammerPulse .35s ease}
  #reelBarBg.fx-hammer #reelBar{background:linear-gradient(90deg,#0288d1,#4fc3f7,#e1f5fe)}
  #reelBarBg.fx-trident{box-shadow:0 0 18px 6px #ffd700,0 0 40px #ff8f00;border-color:#ffe082;animation:tridentFlash .3s ease}
  #reelBarBg.fx-trident #reelBar{background:linear-gradient(90deg,#ff8f00,#ffd700,#fff59d)}
  #reelBarBg.fx-void{box-shadow:0 0 22px 8px #ff6d00,0 0 50px #fff,0 0 80px #ff3d00;border-color:#ffab40;animation:voidPulse .4s ease}
  #reelBarBg.fx-void #reelBar{background:linear-gradient(90deg,#212121,#ff6d00,#fff,#ff6d00)}
  @keyframes hammerPulse{0%{transform:scaleY(1)}40%{transform:scaleY(1.45)}100%{transform:scaleY(1)}}
  @keyframes tridentFlash{0%{filter:brightness(1)}50%{filter:brightness(1.8)}100%{filter:brightness(1)}}
  @keyframes voidPulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  .skill-pop{display:inline-block;animation:skillPop .7s ease forwards}
  @keyframes skillPop{0%{opacity:0;transform:translateY(8px) scale(.6)}30%{opacity:1;transform:translateY(-4px) scale(1.2)}100%{opacity:0;transform:translateY(-18px) scale(1)}}
  #sunBeam{
    display:none;position:fixed;left:50%;top:0;width:14px;height:0;
    transform:translateX(-50%);
    background:linear-gradient(180deg,
      rgba(255,255,220,1) 0%,
      rgba(255,235,59,0.95) 8%,
      rgba(255,171,64,0.9) 35%,
      rgba(255,109,0,0.85) 70%,
      rgba(255,60,0,0.5) 90%,
      rgba(255,40,0,0) 100%);
    box-shadow:0 0 18px 6px rgba(255,160,0,0.9),0 0 40px 14px rgba(255,100,0,0.55),0 0 70px 20px rgba(255,60,0,0.25);
    border-radius:8px;z-index:100;pointer-events:none;
    animation:sunBeamStrike .5s ease-out forwards;
  }
  #sunBeam::before{
    content:"";position:absolute;left:50%;top:-6px;width:36px;height:36px;
    transform:translateX(-50%);
    background:radial-gradient(circle,#ffffff 0%,#fff59d 30%,#ff6d00 65%,transparent 100%);
    border-radius:50%;
    box-shadow:0 0 24px 10px rgba(255,200,50,0.9),0 0 48px 16px rgba(255,120,0,0.5);
  }
  #sunBeam::after{
    content:"";position:absolute;left:50%;bottom:-4px;width:70px;height:24px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(255,200,80,1) 0%,rgba(255,100,0,0.6) 45%,transparent 70%);
    border-radius:50%;
    box-shadow:0 0 30px 12px rgba(255,140,0,0.7);
  }
  @keyframes sunBeamStrike{
    0%{opacity:0;height:0}
    20%{opacity:1;height:35vh}
    55%{opacity:1;height:70vh}
    100%{opacity:0;height:75vh}
  }
  #reelBarBg.fx-sun{box-shadow:0 0 22px 8px #ff6d00,0 0 50px #ffab40;border-color:#ffab40;animation:voidPulse .35s ease}
  #reelBarBg.fx-sun #reelBar{background:linear-gradient(90deg,#e65100,#ff6d00,#ffeb3b,#ff6d00)}
  #seraphicBeam{
    display:none;position:fixed;left:50%;top:0;width:12px;height:0;
    transform:translateX(-50%);
    background:linear-gradient(180deg,
      rgba(255,255,255,1) 0%,
      rgba(255,245,157,0.95) 10%,
      rgba(255,215,0,0.9) 40%,
      rgba(255,193,7,0.75) 75%,
      rgba(255,200,50,0) 100%);
    box-shadow:0 0 16px 6px rgba(255,215,0,0.9),0 0 36px 12px rgba(255,235,59,0.5);
    border-radius:8px;z-index:100;pointer-events:none;
    animation:sunBeamStrike .5s ease-out forwards;
  }
  #seraphicBeam::before{
    content:"";position:absolute;left:50%;top:-8px;width:28px;height:28px;
    transform:translateX(-50%);
    background:radial-gradient(circle,#fff 0%,#ffd700 45%,transparent 70%);
    border-radius:50%;
    box-shadow:0 0 20px 8px rgba(255,215,0,0.85);
  }
  #reelBarBg.fx-seraph{box-shadow:0 0 22px 8px #ffd700,0 0 45px #fff59d;border-color:#ffe082;animation:tridentFlash .35s ease}
  #reelBarBg.fx-seraph #reelBar{background:linear-gradient(90deg,#f9a825,#ffd700,#fffde7,#ffd700)}
  
  #zenithOrbit{
    display:none;position:fixed;left:50%;z-index:99;pointer-events:none;
    width:200px;height:200px;margin-left:-100px;margin-top:-100px;
  }
  #zenithOrbit .zrod{
    position:absolute;left:50%;top:50%;width:36px;height:52px;
    margin-left:-18px;margin-top:-26px;
    animation:zenithSpin 3s linear infinite;
    filter:drop-shadow(0 0 6px currentColor);
  }
  #zenithOrbit .zrod canvas{
    width:36px;height:52px;display:block;
  }
  #zenithOrbit .zcenter{
    position:absolute;left:50%;top:50%;width:48px;height:70px;
    margin-left:-24px;margin-top:-35px;
    filter:drop-shadow(0 0 12px #ce93d8) drop-shadow(0 0 20px #7e57c2);
    animation:zenithPulse 1.2s ease-in-out infinite;
    z-index:2;
  }
  #zenithOrbit .zcenter canvas{
    width:48px;height:70px;display:block;
  }
  @keyframes zenithPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }
  @keyframes zenithSpin{
    from{ transform: rotate(0deg) translateX(78px) rotate(0deg); }
    to{ transform: rotate(360deg) translateX(78px) rotate(-360deg); }
  }
  #luminSlash{
    display:none;position:fixed;left:50%;z-index:100;pointer-events:none;
    width:70px;height:130px;margin-left:-35px;
    animation:luminFall .5s ease-in forwards;
  }
  #luminSlash svg{width:100%;height:100%;filter:drop-shadow(0 0 14px #40c4ff) drop-shadow(0 0 28px #0277bd)}
  @keyframes luminFall{
    0%{ top: -20%; opacity:0; transform: rotate(-25deg) scale(0.6); }
    30%{ opacity:1; top: 30%; transform: rotate(-10deg) scale(1.05); }
    60%{ top: var(--lumin-target, 55%); transform: rotate(5deg) scale(1.2); }
    80%{ top: var(--lumin-target, 55%); transform: rotate(-3deg) scale(1.1); }
    100%{ top: var(--lumin-target, 55%); opacity:0; transform: rotate(0deg) scale(1); }
  }
  #reelBarBg.fx-lumin{
    box-shadow:0 0 26px 12px #40c4ff,0 0 55px #81d4fa;
    border-color:#e3f2fd;
    animation:megaBarHit .35s ease;
  }
  #reelBarBg.fx-lumin #reelBar{background:linear-gradient(90deg,#0277bd,#40c4ff,#e3f2fd,#40c4ff)}
  #ruinousSlash{
    display:none;position:fixed;left:50%;z-index:100;pointer-events:none;
    width:70px;height:130px;margin-left:-35px;
    animation:ruinousFall .5s ease-in forwards;
  }
  #ruinousSlash svg{width:100%;height:100%;filter:drop-shadow(0 0 14px #ff1744) drop-shadow(0 0 28px #b71c1c)}
  @keyframes ruinousFall{
    0%{ top: -20%; opacity:0; transform: rotate(-25deg) scale(0.6); }
    30%{ opacity:1; top: 30%; transform: rotate(-10deg) scale(1.05); }
    60%{ top: var(--ruin-target, 55%); transform: rotate(5deg) scale(1.2); }
    80%{ top: var(--ruin-target, 55%); transform: rotate(-3deg) scale(1.1); }
    100%{ top: var(--ruin-target, 55%); opacity:0; transform: rotate(0deg) scale(1); }
  }
  #reelBarBg.fx-ruinous{
    box-shadow:0 0 26px 12px #ff1744,0 0 55px #ff5252;
    border-color:#ff8a80;
    animation:megaBarHit .35s ease;
  }
  #reelBarBg.fx-ruinous #reelBar{background:linear-gradient(90deg,#b71c1c,#ff1744,#ffeb3b,#ff1744)}
  #noLifeKey{
    display:none;position:fixed;left:50%;z-index:100;pointer-events:none;
    width:90px;height:90px;margin-left:-45px;
    animation:noLifeSpin .55s ease-out forwards;
  }
  #noLifeKey svg{width:100%;height:100%;filter:drop-shadow(0 0 12px #ff1744) drop-shadow(0 0 24px #b71c1c)}
  @keyframes noLifeSpin{
    0%{ opacity:0; transform: scale(0.4) rotate(-90deg); }
    25%{ opacity:1; transform: scale(1.1) rotate(20deg); }
    55%{ transform: scale(1.25) rotate(200deg); }
    80%{ transform: scale(1.1) rotate(340deg); }
    100%{ opacity:0; transform: scale(0.9) rotate(360deg); }
  }
  #reelBarBg.fx-nolife{
    box-shadow:0 0 24px 10px #ff1744,0 0 50px #c62828;
    border-color:#ff8a80;
    animation:voidPulse .35s ease;
  }
  #reelBarBg.fx-nolife #reelBar{background:linear-gradient(90deg,#b71c1c,#ff1744,#ff8a80,#ff1744)}

  #megaBite{
    display:none;position:fixed;left:50%;z-index:100;pointer-events:none;
    width:180px;height:100px;margin-left:-90px;
    animation:megaLunge .6s cubic-bezier(.2,.85,.3,1.05) forwards;
  }
  #megaBite svg{width:100%;height:100%;filter:drop-shadow(0 0 14px #00e5ff) drop-shadow(0 6px 18px #006064)}
  @keyframes megaLunge{
    0%{
      top: 110%;
      opacity: 0;
      transform: scale(0.5) rotate(12deg);
    }
    20%{
      opacity: 1;
      top: 70%;
      transform: scale(0.9) rotate(6deg);
    }
    50%{
      top: var(--mega-target, 60%);
      transform: scale(1.35) rotate(-4deg);
    }
    65%{
      top: var(--mega-target, 60%);
      transform: scale(1.45) rotate(0deg);
    }
    80%{
      top: var(--mega-target, 60%);
      transform: scale(1.2) rotate(2deg);
    }
    100%{
      top: var(--mega-target, 60%);
      opacity: 0;
      transform: scale(1.1) rotate(0deg);
    }
  }
  #megaBite.impact-shake{
    animation: megaLunge .6s cubic-bezier(.2,.85,.3,1.05) forwards, megaShake .15s ease-in-out 0.35s 2;
  }
  @keyframes megaShake{
    0%,100%{ margin-left:-90px; }
    50%{ margin-left:-96px; }
  }
  #reelBarBg.fx-mega{
    box-shadow:0 0 28px 12px #00e5ff,0 0 55px #00bcd4,0 0 80px rgba(0,229,255,0.4);
    border-color:#e0f7fa;
    animation:megaBarHit .4s ease;
  }
  #reelBarBg.fx-mega #reelBar{background:linear-gradient(90deg,#004d40,#00e5ff,#e0f7fa,#00bcd4,#006064)}
  @keyframes megaBarHit{
    0%{ transform:scaleY(1); }
    30%{ transform:scaleY(1.35); filter:brightness(1.4); }
    60%{ transform:scaleY(0.95); }
    100%{ transform:scaleY(1); filter:brightness(1); }
  }
  #hammerDrop{
    display:none;position:fixed;right:-40px;top:18%;z-index:100;pointer-events:none;
    width:70px;height:110px;
    transform-origin: 50% 0%;
    filter:drop-shadow(0 0 10px #4fc3f7) drop-shadow(0 6px 18px #01579b);
    animation:hammerSwing .6s cubic-bezier(.25,.8,.3,1.05) forwards;
  }
  #hammerDrop .h-head{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:58px;height:28px;
    background:linear-gradient(180deg,#e1f5fe 0%,#4fc3f7 40%,#0277bd 100%);
    border-radius:6px 6px 4px 4px;
    border:2px solid #81d4fa;
    box-shadow:inset 0 2px 0 rgba(255,255,255,0.5),0 0 12px #29b6f6;
  }
  #hammerDrop .h-head::before,
  #hammerDrop .h-head::after{
    content:"";position:absolute;top:-4px;width:12px;height:36px;
    background:linear-gradient(180deg,#81d4fa,#01579b);
    border-radius:3px;
  }
  #hammerDrop .h-head::before{left:-8px}
  #hammerDrop .h-head::after{right:-8px}
  #hammerDrop .h-face{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:36px;height:18px;
    background:linear-gradient(180deg,#b3e5fc,#0288d1);
    border-radius:3px;
  }
  #hammerDrop .h-handle{
    position:absolute;top:34px;left:50%;transform:translateX(-50%);
    width:10px;height:72px;
    background:linear-gradient(90deg,#01579b,#4fc3f7 40%,#0277bd 60%,#01579b);
    border-radius:4px;
    box-shadow:0 0 8px rgba(41,182,246,0.5);
  }
  #hammerDrop .h-grip{
    position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
    width:14px;height:22px;
    background:linear-gradient(180deg,#0277bd,#0d47a1);
    border-radius:3px;
    border:1px solid #81d4fa;
  }
  @keyframes hammerSwing{
    /* เริ่มจากขวาจอ เหวี่ยงโค้งลงมาทุบ */
    0%{
      right: -40px; left: auto;
      top: 18%;
      opacity: 0;
      transform: rotate(55deg) scale(0.75);
    }
    12%{ opacity: 1; }
    45%{
      right: 28%;
      top: 42%;
      transform: rotate(15deg) scale(1.1);
    }
    68%{
      right: 42%;
      top: auto;
      bottom: 95px;
      transform: rotate(-20deg) scale(1.2);
    }
    82%{
      right: 44%;
      bottom: 88px;
      transform: rotate(-5deg) scale(1.05);
    }
    100%{
      right: 44%;
      bottom: 90px;
      opacity: 0;
      transform: rotate(0deg) scale(0.95);
    }
  }
  #hammerImpact{
    display:none;position:fixed;left:50%;z-index:99;pointer-events:none;
    width:80px;height:24px;margin-left:-40px;
    background:radial-gradient(ellipse,rgba(79,195,247,0.95) 0%,rgba(2,136,209,0.5) 50%,transparent 70%);
    border-radius:50%;
    box-shadow:0 0 30px 12px rgba(41,182,246,0.7);
    animation:hammerImpactFx .4s ease-out forwards;
  }
  @keyframes hammerImpactFx{
    0%{opacity:0;width:20px;height:8px;margin-left:-10px}
    40%{opacity:1;width:100px;height:30px;margin-left:-50px}
    100%{opacity:0;width:140px;height:18px;margin-left:-70px}
  }
  #timingTrack{position:relative;height:36px;width:100%;max-width:340px;margin:8px auto 0;background:linear-gradient(90deg,#1a0000,#4a0000 40%,#2b0000);border-radius:12px;border:2px solid #c62828;overflow:hidden}

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const moneyEl=document.getElementById('money'),bagInfoEl=document.getElementById('bagInfo');
const locNameEl=document.getElementById('locName'),rodNameEl=document.getElementById('rodName');
const levelEl=document.getElementById('level'),expEl=document.getElementById('exp'),expMaxEl=document.getElementById('expMax');
const castBtn=document.getElementById('castBtn'),messageEl=document.getElementById('message');
const panel=document.getElementById('panel'),panelTitle=document.getElementById('panelTitle'),panelContent=document.getElementById('panelContent');
const fishingUI=document.getElementById('fishingUI'),biteText=document.getElementById('biteText');
const reelBar=document.getElementById('reelBar'),reelBtn=document.getElementById('reelBtn');
const timingZone=document.getElementById('timingZone'),timingMarker=document.getElementById('timingMarker');
const timingHint=document.getElementById('timingHint');
let timingTimer=null;
let fishY=50, fishVY=0, playerY=70, isHoldingReel=false;
let playerBarSize=22, fishSpeed=1.2;


// ===== ระบบเสียง v3 สมจริง (สังเคราะห์ด้วย Web Audio ทั้งหมด ไม่ใช้ไฟล์เสียง) =====
// เสียงสเตอริโอ ตำแหน่งซ้าย-ขวา รีเวิร์บ 2 ชั้น (กลางแจ้ง/ถ้ำ) คลื่นซัดจริง ลมกระโชก ฝนหนาแน่น นก/กบ/จิ้งหรีดแบบมีรูปคลื่น
let audioCtx = null;
let soundEnabled = true;
let ambientNodes = [];   // เลเยอร์เสียงต่อเนื่อง
let ambientTimers = [];  // ตัวสุ่มเสียงเหตุการณ์
let masterBus = null, reverbSend = null, revWetS = null, revWetL = null;
let _evPan = null;       // ตำแหน่งซ้าย-ขวาของเสียงเหตุการณ์ที่กำลังเล่น
let _wetMul = 1;         // ความก้องของเกาะปัจจุบัน
const _noiseCache = {};
const _rnd = (a, b) => a + Math.random()*(b - a);

function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); buildBus(); }
    catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function makeIR(c, secs, power, early){
  const len = Math.floor(c.sampleRate * secs), ir = c.createBuffer(2, len, c.sampleRate);
  for(let ch = 0; ch < 2; ch++){
    const d = ir.getChannelData(ch); let y = 0;
    for(let i = 0; i < len; i++){
      const p = i/len, a = 0.08 + 0.9*p;               // ยิ่งท้ายยิ่งทึบ (อากาศดูดเสียงสูง)
      y = y*a + (Math.random()*2 - 1)*(1 - a);
      d[i] = y*Math.pow(1 - p, power)*(i < c.sampleRate*0.012 ? 0 : 1)*2.4;
    }
    for(let k = 0; k < early; k++){                    // เสียงสะท้อนช่วงต้น
      const at = Math.floor(c.sampleRate*(0.012 + Math.random()*0.07));
      if(at < len) d[at] += (Math.random() < 0.5 ? -1 : 1)*(0.5 - k*0.05)*(0.7 + Math.random()*0.5);
    }
  }
  return ir;
}
function buildBus(){
  const c = audioCtx;
  masterBus = c.createGain(); masterBus.gain.value = 0.9;
  const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 28;
  const shelf = c.createBiquadFilter(); shelf.type = "highshelf"; shelf.frequency.value = 9000; shelf.gain.value = -3;
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 24; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.25;
  const lim = c.createDynamicsCompressor();
  lim.threshold.value = -2; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.08;
  masterBus.connect(hp); hp.connect(shelf); shelf.connect(comp); comp.connect(lim); lim.connect(c.destination);
  reverbSend = c.createGain();
  const cs = c.createConvolver(); cs.buffer = makeIR(c, 1.1, 3.0, 7);
  const cl = c.createConvolver(); cl.buffer = makeIR(c, 3.6, 2.2, 10);
  revWetS = c.createGain(); revWetS.gain.value = 0.5;
  revWetL = c.createGain(); revWetL.gain.value = 0.15;
  reverbSend.connect(cs); cs.connect(revWetS); revWetS.connect(masterBus);
  reverbSend.connect(cl); cl.connect(revWetL); revWetL.connect(masterBus);
}
function setRoom(s, l, mul){
  _wetMul = mul;
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  revWetS.gain.setTargetAtTime(s, t, 0.4); revWetL.gain.setTargetAtTime(l, t, 0.4);
}
function out(node, wet, pan){
  const c = audioCtx; let dest = node;
  if(pan == null) pan = _evPan;
  if(pan != null && c.createStereoPanner){
    const p = c.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan));
    node.connect(p); dest = p;
  }
  dest.connect(masterBus);
  if(wet > 0){ const s = c.createGain(); s.gain.value = wet*_wetMul; node.connect(s); s.connect(reverbSend); }
}
function noiseBuf(kind){
  if(_noiseCache[kind]) return _noiseCache[kind];
  const c = audioCtx, n = c.sampleRate * 3, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  if(kind === "white"){
    for(let i = 0; i < n; i++) d[i] = Math.random()*2-1;
  } else if(kind === "pink"){
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i = 0; i < n; i++){
      const w = Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.969*b2+w*0.153852;
      b3=0.8665*b3+w*0.3104856; b4=0.55*b4+w*0.5329522; b5=-0.7616*b5-w*0.016898;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
    }
  } else { // brown
    let l = 0;
    for(let i = 0; i < n; i++){ const w = Math.random()*2-1; l = (l + 0.02*w)/1.02; d[i] = l*3.5; }
  }
  // ทำให้วนต่อกันได้เนียน (ครอสเฟดปลายกับต้น)
  const f = Math.floor(c.sampleRate*0.05);
  for(let i = 0; i < f; i++){ const k = i/f; d[n - f + i] = d[n - f + i]*(1 - k) + d[i]*k; }
  return (_noiseCache[kind] = b);
}

// ---- เสียงสั้น ----
function tone(f, dur, o){
  o = o || {};
  if(!soundEnabled) return;
  const c = ensureAudio(); if(!c) return;
  const t = c.currentTime + (o.delay || 0);
  const osc = c.createOscillator(); osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(f, t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + dur);
  if(o.detune) osc.detune.value = o.detune;
  if(o.vib){
    const l = c.createOscillator(); l.frequency.value = o.vib[0];
    const lg = c.createGain(); lg.gain.value = o.vib[1];
    l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05);
  }
  const g = c.createGain(), a = o.attack || 0.005, v = o.vol || 0.1;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + a);
  if(o.sus){
    g.gain.setValueAtTime(v, t + Math.max(a, dur*o.sus));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  } else g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, a + 0.01));
  let node = osc;
  if(o.cut){ const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = o.cut; node.connect(lp); node = lp; }
  if(o.bp){ const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = o.bp[0]; bp.Q.value = o.bp[1]; node.connect(bp); node = bp; }
  node.connect(g); out(g, o.wet || 0, o.pan);
  osc.start(t); osc.stop(t + dur + 0.05);
}
function hit(dur, o){
  o = o || {};
  if(!soundEnabled) return;
  const c = ensureAudio(); if(!c) return;
  const t = c.currentTime + (o.delay || 0);
  const src = c.createBufferSource(); src.buffer = noiseBuf(o.kind || "white");
  const f = c.createBiquadFilter(); f.type = o.type || "bandpass";
  f.frequency.setValueAtTime(o.freq || 1000, t); f.Q.value = o.q || 1;
  if(o.sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.sweep), t + dur);
  const g = c.createGain(), a = o.attack || 0.003;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(o.vol || 0.1, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, a + 0.01));
  src.connect(f); f.connect(g); out(g, o.wet || 0, o.pan);
  src.start(t, Math.random()*2); src.stop(t + dur + 0.05);
}
function bell(f, vol, o){
  o = o || {};
  const P = [[1, 1, 1.8], [2.76, 0.45, 1.1], [5.4, 0.22, 0.6], [8.9, 0.08, 0.3]];
  P.forEach(function(p){
    tone(f*p[0], (o.len || 1) * p[2], {vol: vol*p[1], wet: o.wet == null ? 0.5 : o.wet, delay: o.delay || 0, attack: 0.002, pan: o.pan});
  });
}
const _PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
function chime(vol, wet){ bell(_PENTA[Math.floor(Math.random()*_PENTA.length)], vol || 0.04, {wet: wet == null ? 0.8 : wet, len: 1.3}); }
function playTone(freq, dur, type, vol, slide){ tone(freq, dur, {type: type, vol: vol, slide: slide}); }
function playNoise(dur, vol){ hit(dur, {type: "lowpass", freq: 2500, vol: vol}); }

// ---- เสียงน้ำ ----
function bloop(f, vol, delay, pan){          // ฟองอากาศแตกใต้น้ำ (ความถี่พุ่งขึ้น)
  tone(f, 0.05 + 70/f, {slide: f*_rnd(1.7, 2.4), vol: vol, delay: delay || 0, wet: 0.25, pan: pan, attack: 0.003});
}
function droplets(n, vol, delay){
  for(let i = 0; i < n; i++) bloop(_rnd(1100, 3600), vol*_rnd(0.5, 1), (delay || 0) + Math.pow(Math.random(), 1.6)*0.9, _rnd(-0.6, 0.6));
}
function splash(size){
  size = size || 1;
  hit(0.16, {type: "lowpass", freq: 1600, sweep: 300, vol: 0.2*size, attack: 0.002, wet: 0.15});              // กระแทกผิวน้ำ
  tone(140, 0.22, {slide: 45, vol: 0.17*size, wet: 0.15});                                                         // ตุ้บใต้น้ำ
  hit(0.5 + 0.2*size, {kind: "pink", type: "bandpass", freq: 2200, sweep: 600, q: 0.6, vol: 0.12*size, attack: 0.01, wet: 0.25});
  hit(0.9 + 0.3*size, {type: "highpass", freq: 5200, vol: 0.045*size, attack: 0.03, delay: 0.03, wet: 0.2});    // ละอองน้ำ
  const nb = 3 + Math.round(size*3);
  for(let i = 0; i < nb; i++) bloop(_rnd(280, 900), 0.06*size, 0.07 + i*_rnd(0.04, 0.09), _rnd(-0.4, 0.4));    // ฟองอากาศจม
  droplets(4 + Math.round(size*4), 0.03*size, 0.14);
}
function plop(){ bloop(_rnd(260, 480), 0.09, 0, _evPan); }
function drip(wet){
  const f = _rnd(900, 1700);
  tone(f, 0.11, {slide: f*0.55, vol: 0.06, wet: wet == null ? 0.7 : wet});
}
function waveSurge(size, fromSched){          // คลื่นซัดเข้าฝั่ง: ไต่ขึ้น → ฟองแตก → ถอยกลับ
  if(!soundEnabled) return;
  const c = ensureAudio(); if(!c) return;
  size = size || 1;
  const t = c.currentTime, rise = _rnd(1.6, 3.0), fall = _rnd(2.6, 5.0), dir = Math.random() < 0.5 ? -1 : 1;
  const pan = c.createStereoPanner ? c.createStereoPanner() : null;
  if(pan){ pan.pan.setValueAtTime(dir*-0.75, t); pan.pan.linearRampToValueAtTime(dir*0.75, t + rise + fall); }
  const body = c.createBufferSource(); body.buffer = noiseBuf("pink"); body.loop = true;
  const bf = c.createBiquadFilter(); bf.type = "lowpass"; bf.Q.value = 0.8;
  bf.frequency.setValueAtTime(220, t); bf.frequency.exponentialRampToValueAtTime(1300, t + rise); bf.frequency.exponentialRampToValueAtTime(300, t + rise + fall);
  const bg = c.createGain(); bg.gain.setValueAtTime(0.0001, t);
  bg.gain.exponentialRampToValueAtTime(0.13*size, t + rise); bg.gain.exponentialRampToValueAtTime(0.0001, t + rise + fall);
  const foam = c.createBufferSource(); foam.buffer = noiseBuf("white"); foam.loop = true;
  const ff = c.createBiquadFilter(); ff.type = "bandpass"; ff.frequency.value = 4800; ff.Q.value = 0.5;

function loopLayer(o){
  const c = ensureAudio(); if(!c) return null;
  const vol = o.vol || 0.05;
  const g = c.createGain(); g.gain.value = 0;
  const h = {gain: g, stopList: []}, filters = [];
  const sides = o.wide === false ? [0] : [-0.7, 0.7];
  sides.forEach(function(pn){
    const src = c.createBufferSource(); src.buffer = noiseBuf(o.kind || "pink"); src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.type || "lowpass"; f.frequency.value = o.freq || 800; f.Q.value = o.q || 0.7;
    src.connect(f); filters.push(f);
    if(pn !== 0 && c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = pn; f.connect(p); p.connect(g); }
    else f.connect(g);
    src.start(c.currentTime, Math.random()*2.5);
    h.stopList.push(src);
  });
  out(g, o.wet || 0, 0);
  const t = c.currentTime, tgt = vol*1.35*(sides.length > 1 ? 0.75 : 1);   // ฐานเสียงต่อเนื่องให้ได้ยินตลอด
  g.gain.linearRampToValueAtTime(tgt, t + 1.6);
  if(o.lfoRate){
    const l = c.createOscillator(); l.frequency.value = o.lfoRate;
    const lg = c.createGain();
    if(o.lfoTarget === "freq"){ lg.gain.value = (o.freq || 800)*(o.lfoDepth || 0.4); l.connect(lg); filters.forEach(function(f){ lg.connect(f.frequency); }); }
    else { lg.gain.value = tgt*Math.min(0.35, o.lfoDepth || 0.35); l.connect(lg); lg.connect(g.gain); }
    l.start(); h.stopList.push(l);
  }
  if(o.drift){                                   // ความดังเปลี่ยนไปเรื่อยๆ ไม่ซ้ำกัน
    sched(function(){
      g.gain.setTargetAtTime(tgt*_rnd(1 - Math.min(0.25, o.drift*0.4), 1 + o.drift*0.3), audioCtx.currentTime, 1.4);
      if(o.type === "bandpass" && o.freq) filters.forEach(function(f){ f.frequency.setTargetAtTime(o.freq*_rnd(0.8, 1.3), audioCtx.currentTime, 1.8); });
    }, 2500, 6000, true);
  }
  ambientNodes.push(h); return h;
}
function droneLayer(freq, type, vol, o){
  o = o || {};
  const c = ensureAudio(); if(!c) return null;
  const osc = c.createOscillator(); osc.type = type || "sine"; osc.frequency.value = freq;
  if(o.detune) osc.detune.value = o.detune;
  const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = o.cut || 1200;
  const g = c.createGain(); g.gain.value = 0;
  osc.connect(f); f.connect(g); out(g, o.wet || 0, o.pan == null ? 0 : o.pan);
  g.gain.linearRampToValueAtTime(vol, c.currentTime + 2.2);
  osc.start();
  const h = {gain: g, stopList: [osc]};
  const lfo = c.createOscillator(); lfo.frequency.value = o.lfoRate || _rnd(0.12, 0.24);
  const lg = c.createGain(); lg.gain.value = vol*(o.lfoDepth || 0.4);
  lfo.connect(lg); lg.connect(g.gain); lfo.start(); h.stopList.push(lfo);
  ambientNodes.push(h); return h;
}
function sched(fn, minMs, maxMs, force){
  const h = {t: null, dead: false};
  const run = function(){
    if(h.dead) return;
    h.t = setTimeout(function(){
      if(h.dead) return;
      if(soundEnabled && !document.hidden && audioCtx && audioCtx.state === "running"){
        _evPan = force ? null : _rnd(-0.85, 0.85);
        try{ fn(); }catch(e){}
        _evPan = null;
      }
      run();
    }, minMs + Math.random()*(maxMs - minMs));
  };
  run(); ambientTimers.push(h); return h;
}
const _day = fn => function(){ if(isDay) fn(); };
const _night = fn => function(){ if(!isDay) fn(); };

function stopAmbient(){
  ambientTimers.forEach(function(h){ h.dead = true; clearTimeout(h.t); });
  ambientTimers = [];
  const c = audioCtx;
  ambientNodes.forEach(function(n){
    try{
      if(c){ const p = n.gain.gain, now = c.currentTime; p.cancelScheduledValues(now); p.setValueAtTime(p.value, now); p.linearRampToValueAtTime(0.0001, now + 0.6); }
    }catch(e){}
    setTimeout(function(){ n.stopList.forEach(function(s){ try{ s.stop(); }catch(e){} }); }, 800);
  });
  ambientNodes = [];
}

function applyUILanguage(){
  const L = LANG[currentLang]||LANG.th;
  document.title = L.gameTitle;
  document.querySelectorAll("h1").forEach(h=>{ h.textContent = "🎣 "+L.gameTitle; });
  const sub = document.querySelector("#loginScreen .sub");
  if(sub) sub.textContent = L.loginSub;
  const labels = document.querySelectorAll("#loginScreen label");
  if(labels[0]) labels[0].textContent = L.username;
  if(labels[1]) labels[1].textContent = L.password;
  const iu=document.getElementById("inputUser"), ip=document.getElementById("inputPass");
  if(iu) iu.placeholder = L.userPlaceholder;
  if(ip) ip.placeholder = L.passPlaceholder;
  const bl=document.getElementById("btnLogin"), br=document.getElementById("btnRegister");
  if(bl) bl.textContent = L.login;
  if(br) br.textContent = L.register;
  const map = {locationBtn:L.location,castBtn:L.cast,shopBtn:L.shop,questBtn:L.quest,craftBtn:L.craft,bookBtn:L.book,statBtn:L.stats,settingsBtn:L.settings,closePanel:L.close,invBtn:msg("กระเป๋า","Bag")};
  for(const id in map){ const el=document.getElementById(id); if(el) el.textContent=map[id]; }
  const rb=document.getElementById("reelBtn"); if(rb) rb.textContent=L.pull;
  const ml=document.getElementById("moneyLabel"); if(ml) ml.textContent = currentLang==="en" ? "Coins" : "เงิน";
}
function setLanguage(lang){
  currentLang = lang;
  localStorage.setItem("beta_lang", lang);
  applyUILanguage();
  if(typeof updateUI === "function" && currentUser) updateUI();
  if(panel.style.display==="block") openSettings();
}

function makeFishKey(name, weight){ return name + "@" + weight; }
function parseFishKey(key){
  let aurora = false;
  let k = key;
  if(k.endsWith("@aurora")){
    aurora = true;
    k = k.slice(0, -7);
  }
  const i = k.lastIndexOf("@");
  if(i < 0) return {name:k, weight:"?", aurora};
  return {name:k.slice(0,i), weight:k.slice(i+1), aurora};
}

function getToday(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function initDailyQuests(){
  const today=getToday(),saved=localStorage.getItem("fisch_v4");
  if(saved){const data=JSON.parse(saved);if(data.date===today){dailyQuests=data.quests;questProgress=data.progress||{};claimedQuests=data.claimed||{};return}}
  dailyQuests=[...questTemplates].sort(()=>Math.random()-0.5).slice(0,5);
  questProgress={};claimedQuests={};dailyQuests.forEach(q=>questProgress[q.id]=0);saveDaily();
}
function saveDaily(){localStorage.setItem("fisch_v4",JSON.stringify({date:getToday(),quests:dailyQuests,progress:questProgress,claimed:claimedQuests}))}
function addQuestProgress(type,amount=1){
  dailyQuests.forEach(q=>{if(q.type===type&&!claimedQuests[q.id])questProgress[q.id]=Math.min((questProgress[q.id]||0)+amount,q.target)});
  addStoryProgress(type, amount);
  saveDaily();
}
function claimQuest(id){
  const q=dailyQuests.find(x=>x.id===id);
  if(!q||claimedQuests[id]||(questProgress[id]||0)<q.target)return;

  updateUI();
  showMessage(msg(`รับรางวัล!\n+${q.reward} เงิน`,`Reward claimed!\n+${q.reward} coins`),1800);

}

let activeStory={}; // id -> progress
let acceptedStory={}; // id -> true
let completedStory={}; // id -> true

function acceptStory(id){
  if(acceptedStory[id] || completedStory[id]) return;
  acceptedStory[id]=true;
  activeStory[id]=0;
  // เซฟทันที กันค่าเลเวล/กระเป๋าหายหลังรับเควส
  try{ saveGame(); }catch(e){}
  updateUI();
  showMessage(msg("รับภารกิจแล้ว!\n","Quest accepted!\n")+tn((storyQuests.find(q=>q.id===id)||{}).name||id), 1800);
  openQuests();
}
function addStoryProgress(type, amount=1){
  storyQuests.forEach(q=>{
    if(!acceptedStory[q.id] || completedStory[q.id]) return;
    if(q.type!==type) return;
    activeStory[q.id] = Math.min((activeStory[q.id]||0)+amount, q.target);
  });
}
function claimStory(id){
  const q = storyQuests.find(x=>x.id===id);
  if(!q || completedStory[id]) return;
  if((activeStory[id]||0) < q.target) return;
  completedStory[id]=true;
  money += q.rewardMoney;
  let itemMsg = "";
  if(q.rewardItem){
    if(q.rewardItem==="ไม้" || q.rewardItem==="เหล็ก" || q.rewardItem==="คริสตัล" || q.rewardItem==="เกล็ดมังกร"){
      materials[q.rewardItem] = (materials[q.rewardItem]||0) + q.rewardQty;
      itemMsg = `\n+${q.rewardItem} x${q.rewardQty}`;
    } else {
      const bait = baits.find(b=>b.name===q.rewardItem);
      if(bait){ bait.owned += q.rewardQty; itemMsg = `\n+${q.rewardItem} x${q.rewardQty}`; }
    }
  }
  try{ saveGame(); }catch(e){}
  updateUI();
  SFX.levelup();
  showMessage(msg(`🎉 ภารกิจสำเร็จ!\n${tn(q.name)}\n+${q.rewardMoney} เงิน${itemMsg}`,`🎉 Quest complete!\n${tn(q.name)}\n+${q.rewardMoney} coins${itemMsg}`), 2800);
  openQuests();
}

  }
  updateUI();
  if(leveled && level < 1000 && level !== 500 && level !== 750){
    SFX.levelup();
    showMessage(msg(`เลเวลอัพ! Lv.${level}\nได้เงินโบนัส`,`Level up! Lv.${level}\nBonus coins`), 2200);
  }
  checkAchievements();
}
function checkAchievements(){
  achievementList.forEach(a=>{
    if(!achievements[a.id]&&a.check()){achievements[a.id]=true;money+=a.reward;showMessage(msg(`🏆 ความสำเร็จ!\n${a.name}\n+${a.reward} เงิน`,`🏆 Achievement!\n${a.name}\n+${a.reward} coins`),2500)}
  });
}

function changeWeather(){
  // โอกาสออโรร่า 2% · อื่นๆ แบ่งเท่าๆ
  const roll = Math.random();
  if(roll < 0.02){
    currentWeather = 3; // ออโรร่า
  } else {
    currentWeather = Math.floor(Math.random()*3); // 0-2
  }
  isDay = Math.random()>0.4;
  // ออโรร่าอยู่ 5 นาที · อากาศอื่น 10 นาที
  const durMs = (currentWeather===3) ? 5*60*1000 : 10*60*1000;
  weatherEndAt = Date.now() + durMs;
  updateUI();
  if(currentUser) startAmbient(currentLoc, currentWeather);
  if(currentWeather===3){
    showMessage(msg("🌌 ออโรร่า!\nปลาที่ตกได้ราคา x2 (5 นาที)","🌌 Aurora!\nCaught fish sell x2 (5 min)"), 2500);
  }
}
function ensureWeatherTimer(){
  if(weatherTimerIv) return;
  weatherTimerIv = setInterval(()=>{
    if(!currentUser) return;
    if(!weatherEndAt){
      changeWeather();
      return;
    }
    if(Date.now() >= weatherEndAt){
      changeWeather();
    } else {
      // อัปเดตนาฬิกาอากาศบน UI
      updateWeatherHud();
    }
  }, 1000);
}
function updateWeatherHud(){
  const el = document.getElementById('weatherInfo');
  if(!el) return;
  const w = weathers[currentWeather];
  let left = "";
  if(weatherEndAt){
    const sec = Math.max(0, Math.ceil((weatherEndAt - Date.now())/1000));
    const m = Math.floor(sec/60), s = sec%60;
    left = ` | ⏱ ${m}:${String(s).padStart(2,"0")}`;
  }
  let boost = "";
  if(xpBoostUntil && Date.now() < xpBoostUntil){
    const sec = Math.max(0, Math.ceil((xpBoostUntil - Date.now())/1000));
    boost = ` | 🧪 XP x100 ${sec}s`;
  }
  el.textContent = `${w.icon} ${tn(w.name)} | ${isDay?t("day"):t("night")} | ${tn(baits[currentBait].name)}${left}${boost}`;
}

// ===== ISLAND SCENES + LIGHTING (added) =====
function _rr(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function _glow(x,y,r,rgb,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,"rgba("+rgb+","+a+")");
  g.addColorStop(1,"rgba("+rgb+",0)");
  ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function _beam(x1,y1,x2,y2,w1,w2,rgb,a){
  const g=ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,"rgba("+rgb+","+a+")");
  g.addColorStop(1,"rgba("+rgb+",0)");
  ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x1-w1/2,y1); ctx.lineTo(x1+w1/2,y1);
  ctx.lineTo(x2+w2/2,y2); ctx.lineTo(x2-w2/2,y2);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function _rimCol(a){ return isDay ? "rgba(255,240,190,"+a+")" : "rgba(170,190,255,"+a+")"; }
function _reflect(x,y,w,col){
  const tm=Date.now()/900;
  ctx.save(); ctx.globalAlpha=0.2; ctx.fillStyle=col;
  for(let i=0;i<5;i++){
    const ww=w*(0.95-i*0.15);
    ctx.fillRect(x-ww/2+Math.sin(tm+i)*4, y+4+i*5, ww, 2);
  }
  ctx.restore();
}
// island silhouette: shaded left, rim light on right (light comes from upper right)
function _mound(x,baseY,w,h,top,bot){
  const g=ctx.createLinearGradient(0,baseY-h,0,baseY);
  g.addColorStop(0,top); g.addColorStop(1,bot);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x-w/2,baseY);
  ctx.quadraticCurveTo(x-w*0.28,baseY-h*0.95,x,baseY-h);
  ctx.quadraticCurveTo(x+w*0.28,baseY-h*0.95,x+w/2,baseY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle="rgba(0,0,0,0.28)";
  ctx.beginPath();
  ctx.moveTo(x-w/2,baseY);
  ctx.quadraticCurveTo(x-w*0.28,baseY-h*0.95,x,baseY-h);
  ctx.lineTo(x-w*0.04,baseY);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=_rimCol(0.5); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x,baseY-h);
  ctx.quadraticCurveTo(x+w*0.28,baseY-h*0.95,x+w/2,baseY); ctx.stroke();
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.beginPath(); ctx.ellipse(x-w*0.12,baseY+2,w*0.55,3.5,0,0,Math.PI*2); ctx.fill();
}
function _palm(x,y,s,sw){
  const tm=Date.now()/900;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,0.22)";
  ctx.beginPath(); ctx.ellipse(x-14*s,y+2,20*s,3.5*s,0,0,Math.PI*2); ctx.fill();
  const tx=x+8*s+sw, ty=y-42*s;
  ctx.lineCap="round";
  ctx.strokeStyle="#5d4037"; ctx.lineWidth=5*s;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+3*s,y-24*s,tx,ty); ctx.stroke();
  ctx.strokeStyle=isDay?"rgba(255,224,178,0.4)":"rgba(160,180,255,0.3)"; ctx.lineWidth=1.6*s;
  ctx.beginPath(); ctx.moveTo(x+2*s,y); ctx.quadraticCurveTo(x+5*s,y-24*s,tx+1.5*s,ty); ctx.stroke();
  for(let i=0;i<7;i++){
    const a=-Math.PI/2+(i-3)*0.62+Math.sin(tm+i)*0.05;
    const len=(24+(i%2)*5)*s;
    const ex=tx+Math.cos(a)*len, ey=ty+Math.sin(a)*len*0.7+10*s*Math.abs(Math.cos(a));
    const mx=tx+Math.cos(a)*len*0.5, my=ty+Math.sin(a)*len*0.5-6*s;
    const lg=ctx.createLinearGradient(tx,ty,ex,ey);
    lg.addColorStop(0,isDay?"#66bb6a":"#2e5e4e");
    lg.addColorStop(1,isDay?"#1b5e20":"#10301f");
    ctx.fillStyle=lg;
    ctx.beginPath(); ctx.moveTo(tx,ty);
    ctx.quadraticCurveTo(mx,my-4*s,ex,ey);
    ctx.quadraticCurveTo(mx,my+5*s,tx,ty);
    ctx.fill();
  }
  ctx.fillStyle="#4e342e";
  ctx.beginPath(); ctx.arc(tx-3*s,ty+3*s,2.4*s,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(tx+3*s,ty+4*s,2.4*s,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function _crystal(x,y,w,h,hi,lo,rgb){
  _glow(x,y-h*0.5,w*2,rgb,0.28);
  const g=ctx.createLinearGradient(x-w/2,y,x+w/2,y-h);
  g.addColorStop(0,lo); g.addColorStop(1,hi);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x-w/2,y); ctx.lineTo(x-w*0.35,y-h*0.7); ctx.lineTo(x,y-h);
  ctx.lineTo(x+w*0.35,y-h*0.7); ctx.lineTo(x+w/2,y); ctx.closePath(); ctx.fill();
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.moveTo(x-w/2,y); ctx.lineTo(x-w*0.35,y-h*0.7); ctx.lineTo(x,y-h); ctx.lineTo(x-w*0.05,y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.7)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,y-h); ctx.lineTo(x+w*0.35,y-h*0.7); ctx.stroke();
}
function _pillar(x,y,w,h){
  const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
  g.addColorStop(0,"#2b1a14"); g.addColorStop(0.55,"#6d4c41"); g.addColorStop(1,"#a1887f");
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(x-w*0.6,y+2,w*0.9,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=g; ctx.fillRect(x-w/2,y-h,w,h);
  ctx.fillStyle="#8d6e63";
  ctx.fillRect(x-w*0.65,y-h-4,w*1.3,5); ctx.fillRect(x-w*0.65,y-3,w*1.3,3);
  ctx.strokeStyle="rgba(255,235,200,0.35)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+w/2-1,y-h); ctx.lineTo(x+w/2-1,y); ctx.stroke();
  ctx.strokeStyle="rgba(0,0,0,0.4)";
  ctx.beginPath(); ctx.moveTo(x-w*0.1,y-h*0.6); ctx.lineTo(x+w*0.15,y-h*0.45); ctx.lineTo(x-w*0.05,y-h*0.3); ctx.stroke();
}
function _jelly(x,y,s,rgb,tm){
  _glow(x,y,26*s,rgb,0.35);
  ctx.fillStyle="rgba("+rgb+",0.55)";
  ctx.beginPath(); ctx.arc(x,y,12*s,Math.PI,0); ctx.quadraticCurveTo(x,y+5*s,x-12*s,y); ctx.fill();
  ctx.strokeStyle="rgba("+rgb+",0.5)"; ctx.lineWidth=1.3;
  for(let k=-2;k<=2;k++){
    ctx.beginPath(); ctx.moveTo(x+k*4*s,y+2*s);
    ctx.quadraticCurveTo(x+k*4*s+Math.sin(tm*2+k)*5*s,y+14*s,x+k*4*s+Math.sin(tm*2+k+1)*4*s,y+26*s);
    ctx.stroke();
  }
}
function _mangrove(x,y,s){
  const tm=Date.now()/1000;
  ctx.fillStyle="rgba(0,0,0,0.22)";
  ctx.beginPath(); ctx.ellipse(x-8*s,y+6,40*s,6*s,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#3e2723"; ctx.lineWidth=3*s; ctx.lineCap="round";
  for(let i=-3;i<=3;i++){
    ctx.beginPath(); ctx.moveTo(x+i*3*s,y-22*s);
    ctx.quadraticCurveTo(x+i*9*s,y-6*s,x+i*12*s,y+6*s); ctx.stroke();
  }
  ctx.strokeStyle="#4e342e"; ctx.lineWidth=7*s;
  ctx.beginPath(); ctx.moveTo(x,y-4*s); ctx.lineTo(x,y-34*s); ctx.stroke();
  const blobs=[[-18,-44,20],[0,-54,24],[18,-44,20],[-4,-38,18]];
  blobs.forEach(function(b){
    const bx=x+b[0]*s, by=y+b[1]*s, br=b[2]*s;
    const g=ctx.createRadialGradient(bx+br*0.35,by-br*0.4,br*0.1,bx,by,br);
    g.addColorStop(0,isDay?"#9ccc65":"#2f5a3a"); g.addColorStop(0.6,"#2e7d32"); g.addColorStop(1,"#1b3d1f");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
  });
  ctx.strokeStyle="rgba(110,170,90,0.8)"; ctx.lineWidth=1.3;
  for(let i=0;i<6;i++){
    const vx=x+(-24+i*10)*s;
    ctx.beginPath(); ctx.moveTo(vx,y-40*s);
    ctx.quadraticCurveTo(vx+Math.sin(tm+i)*4*s,y-28*s,vx+Math.sin(tm*1.2+i)*3*s,y-14*s-(i%2)*8*s);
    ctx.stroke();
  }
}
function _berg(x,y,w,h){
  ctx.fillStyle="rgba(120,220,255,0.12)";
  ctx.beginPath(); ctx.moveTo(x-w/2,y); ctx.lineTo(x+w/2,y); ctx.lineTo(x+w*0.25,y+h*0.9); ctx.lineTo(x-w*0.2,y+h*0.7); ctx.closePath(); ctx.fill();
  let g=ctx.createLinearGradient(x,y-h,x,y); g.addColorStop(0,"#ffffff"); g.addColorStop(1,"#b3e5fc");
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(x-w/2,y); ctx.lineTo(x-w*0.3,y-h*0.55); ctx.lineTo(x-w*0.05,y-h);
  ctx.lineTo(x+w*0.15,y-h*0.7); ctx.lineTo(x+w*0.3,y-h*0.85); ctx.lineTo(x+w/2,y); ctx.closePath(); ctx.fill();
  g=ctx.createLinearGradient(x-w/2,y,x,y-h); g.addColorStop(0,"#4f8fc0"); g.addColorStop(1,"#90caf9");
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(x-w/2,y); ctx.lineTo(x-w*0.3,y-h*0.55); ctx.lineTo(x-w*0.05,y-h);
  ctx.lineTo(x-w*0.02,y-h*0.35); ctx.lineTo(x-w*0.12,y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.6)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x-w*0.05,y-h); ctx.lineTo(x-w*0.02,y-h*0.35); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,0.85)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x-w*0.05,y-h); ctx.lineTo(x+w*0.15,y-h*0.7); ctx.lineTo(x+w*0.3,y-h*0.85); ctx.stroke();
  ctx.fillStyle="rgba(0,40,80,0.2)";
  ctx.beginPath(); ctx.ellipse(x-w*0.3,y+3,w*0.55,4,0,0,Math.PI*2); ctx.fill();
}
function _temple(x,y,s){
  ctx.fillStyle="rgba(0,0,0,0.25)";

  ctx.strokeStyle=_rimCol(0.55); ctx.lineWidth=1.3;

}
function _cloud(x,y,s,a){

    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x+p[0]*s,y+p[1]*s,p[2]*s,0,Math.PI*2); ctx.fill();
  });
}
function _starfish(x,y,r,col){
  ctx.fillStyle=col; ctx.beginPath();
  for(let i=0;i<10;i++){

    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);

}

    } else if(kind==="mote"){
      const y=H-((tm*8*(0.5+_rr(i))+_rr(i*3)*H)%H);

      const x=_rr(i*2.3)*W, y=95+_rr(i*5.1)*230, a=Math.abs(Math.sin(tm*2+i*1.9));

function _rgb(h){
  h = String(h || "#888").replace("#", "");
  if(h.length === 3) h = h.split("").map(function(c){ return c + c; }).join("");
  return [parseInt(h.slice(0,2),16)||0, parseInt(h.slice(2,4),16)||0, parseInt(h.slice(4,6),16)||0];
}
function _mix(h, to, a){
  const c = _rgb(h);
  return "rgb(" + Math.round(c[0]+(to[0]-c[0])*a) + "," + Math.round(c[1]+(to[1]-c[1])*a) + "," + Math.round(c[2]+(to[2]-c[2])*a) + ")";
}
const _lite = (h, a) => _mix(h, [255,255,255], a);
const _dark = (h, a) => _mix(h, [0,0,0], a);
function _rgba(h, a){ const c = _rgb(h); return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

function _rgrad(g, cx, cy, r, c0, c1){
  const q = g.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
  q.addColorStop(0, c0); q.addColorStop(1, c1); return q;
}
function _flame(g, x, y, s, t, seed){
  const fl = Math.sin(t*12 + seed)*0.8*s;
  g.fillStyle = "#ff6d00";
  g.beginPath(); g.moveTo(x-2.4*s, y+1); g.quadraticCurveTo(x-3.2*s, y-4*s, x, y-8*s+fl); g.quadraticCurveTo(x+3.2*s, y-4*s, x+2.4*s, y+1); g.closePath(); g.fill();
  g.fillStyle = "#ffd54f";
  g.beginPath(); g.moveTo(x-1.4*s, y+1); g.quadraticCurveTo(x-1.8*s, y-2.5*s, x, y-5*s+fl*0.6); g.quadraticCurveTo(x+1.8*s, y-2.5*s, x+1.4*s, y+1); g.closePath(); g.fill();
}
function _starPath(g, x, y, R, r){
  g.beginPath();
  for(let i = 0; i < 10; i++){
    const a = -Math.PI/2 + i*Math.PI/5, rr = (i % 2) ? r : R;
    const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
    if(i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
}

    g.strokeStyle = _rgba(c.glow, 0.9); g.lineWidth = 1.4; g.beginPath(); g.ellipse(x, y-2.5, 6, 1.9, -0.4, 0, 6.283); g.stroke();
    g.fillStyle = "#000"; g.beginPath(); g.arc(x, y-2.5, 2.6, 0, 6.283); g.fill();
    g.strokeStyle = _rgba("#ffffff", 0.7); g.lineWidth = 0.6; g.beginPath(); g.arc(x, y-2.5, 2.9, 3.6, 5.2); g.stroke(); break;
  case "rune":
    g.fillStyle = _rgrad(g, x, y-2, 5, c.hi, c.lo);
    g.beginPath(); g.moveTo(x, y-7); g.lineTo(x+3.4, y-2); g.lineTo(x, y+3); g.lineTo(x-3.4, y-2); g.closePath(); g.fill();
    g.strokeStyle = _rgba(c.glow, 0.5 + 0.5*pulse); g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, y-5); g.lineTo(x, y+1); g.moveTo(x-1.8, y-2.6); g.lineTo(x+1.8, y-2.6); g.stroke();
    _glowDot(g, x, y-2, 8, c.glow, 0.3*pulse); break;
  case "lily":
    g.fillStyle = _rgrad(g, x, y-1, 5, "#a5d6a7", "#2e7d32"); g.beginPath(); g.ellipse(x, y-0.8, 4.8, 2.2, 0, 0, 6.283); g.fill();
    for(let i = 0; i < 5; i++){ const a = -Math.PI/2 + (i-2)*0.55; g.fillStyle = i % 2 ? "#f8bbd0" : "#f48fb1"; g.beginPath(); g.ellipse(x+Math.cos(a)*2, y-3.4+Math.sin(a)*2, 1.1, 2.1, a+Math.PI/2, 0, 6.283); g.fill(); }
    g.fillStyle = "#ffeb3b"; g.beginPath(); g.arc(x, y-3.2, 1, 0, 6.283); g.fill(); break;
  case "serpent":
    g.lineCap = "round"; g.strokeStyle = c.lo; g.lineWidth = 2.8;
    g.beginPath(); g.moveTo(x, y+2); g.bezierCurveTo(x-4, y-1, x+4, y-3, x+1, y-6.5); g.stroke();
    g.strokeStyle = c.acc; g.lineWidth = 1.8; g.beginPath(); g.moveTo(x, y+2); g.bezierCurveTo(x-4, y-1, x+4, y-3, x+1, y-6.5); g.stroke();
    g.fillStyle = c.hi; g.beginPath(); g.moveTo(x-1.8, y-6.2); g.lineTo(x+4.2, y-7.2); g.lineTo(x+0.2, y-9.6); g.closePath(); g.fill();
    g.fillStyle = "#ff1744"; g.beginPath(); g.arc(x+0.6, y-7.6, 0.6, 0, 6.283); g.fill();
    g.fillStyle = "#fff"; g.beginPath(); g.moveTo(x+3.4, y-7.1); g.lineTo(x+3.8, y-5.8); g.lineTo(x+2.8, y-6.9); g.fill(); break;
  }
  g.restore();
}
function _glowDot(g, x, y, r, col, a){
  const q = g.createRadialGradient(x, y, 0, x, y, r);
  q.addColorStop(0, _rgba(col, Math.max(0, Math.min(1, a))));
  q.addColorStop(1, _rgba(col, 0));
  g.fillStyle = q; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
}

// ---- ลวดลายวัสดุบนลำคัน (วาดภายใน clip ของตัวคัน) ----
function _mat(g, mat, hx, c, t){
  switch(mat){
  case "wood":
    g.strokeStyle = "rgba(60,30,10,0.4)"; g.lineWidth = 0.5;
    for(let i = -1; i <= 1; i++){ g.beginPath(); g.moveTo(hx+i*1.1, 37); g.bezierCurveTo(hx+i*1.1+0.8, 28, hx+i*1.1-0.8, 20, hx+i*0.6, 10); g.stroke(); }
    g.fillStyle = "rgba(60,30,10,0.45)"; g.beginPath(); g.ellipse(hx-0.4, 24, 0.7, 1.2, 0, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(hx+0.5, 15, 0.5, 0.9, 0, 0, 6.283); g.fill(); break;
  case "iron":
    g.strokeStyle = "rgba(255,255,255,0.18)"; g.lineWidth = 0.4;
    for(let y = 12; y < 37; y += 2.2){ g.beginPath(); g.moveTo(hx-3, y); g.lineTo(hx+3, y); g.stroke(); }
    g.fillStyle = "rgba(255,255,255,0.6)"; [14, 20, 26].forEach(function(y){ g.beginPath(); g.arc(hx, y, 0.45, 0, 6.283); g.fill(); }); break;
  case "silver": case "gold": {
    const p = ((t*0.55) % 1.6);
    g.fillStyle = "rgba(255,255,255,0.55)";
    g.save(); g.translate(hx, 10 + p*20); g.rotate(-0.5); g.fillRect(-4, -0.9, 8, 1.8); g.restore();
    g.strokeStyle = "rgba(0,0,0,0.18)"; g.lineWidth = 0.5; g.beginPath(); g.moveTo(hx-1, 36); g.lineTo(hx-0.6, 11); g.stroke(); break; }
  case "gem": case "crystal": case "ice": {
    g.strokeStyle = "rgba(255,255,255,0.45)"; g.lineWidth = 0.5;
    for(let y = 14; y < 37; y += 4.6){ g.beginPath(); g.moveTo(hx-3, y+1.6); g.lineTo(hx, y-1.2); g.lineTo(hx+3, y+1.6); g.stroke(); }
    g.fillStyle = "rgba(255,255,255,0.28)"; g.beginPath(); g.moveTo(hx+0.4, 11); g.lineTo(hx+2.2, 36); g.lineTo(hx+0.4, 36); g.closePath(); g.fill();
    const p = ((t*0.7) % 1.5);
    g.fillStyle = "rgba(255,255,255,0.5)"; g.save(); g.translate(hx, 10 + p*20); g.rotate(-0.5); g.fillRect(-4, -0.7, 8, 1.4); g.restore(); break; }
  case "scale":
    g.strokeStyle = "rgba(0,0,0,0.3)"; g.lineWidth = 0.5;
    for(let r = 0; r < 7; r++) for(let k = -1; k <= 1; k++){ g.beginPath(); g.arc(hx+k*2.2+(r%2?1.1:0), 14+r*3.4, 1.2, 0, Math.PI); g.stroke(); }
    g.strokeStyle = "rgba(255,255,255,0.18)"; for(let r = 0; r < 7; r++){ g.beginPath(); g.arc(hx+1.1+(r%2?1.1:0), 13+r*3.4, 1.2, Math.PI, 0); g.stroke(); } break;
  case "stone":
    g.strokeStyle = "rgba(0,0,0,0.4)"; g.lineWidth = 0.5;
    g.beginPath(); g.moveTo(hx-2, 33); g.lineTo(hx, 29); g.lineTo(hx-1.4, 24); g.lineTo(hx+1, 19); g.stroke();
    g.strokeStyle = _rgba(c.glow, 0.5 + 0.5*Math.sin(t*2)); g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(hx-1.2, 28); g.lineTo(hx+1.2, 28); g.moveTo(hx, 26.6); g.lineTo(hx, 29.4); g.moveTo(hx-1.2, 18); g.lineTo(hx+1.2, 20); g.stroke(); break;
  case "rune":
    g.strokeStyle = _rgba(c.glow, 0.45 + 0.4*Math.sin(t*2)); g.lineWidth = 0.6;
    for(let i = 0; i < 4; i++){ const y = 15 + i*5.5; g.beginPath(); g.moveTo(hx-1.2, y); g.lineTo(hx+1.2, y+1.4); g.lineTo(hx-0.6, y+2.8); g.stroke(); } break;
  case "lava": {
    const a = 0.55 + 0.45*Math.sin(t*3);
    g.strokeStyle = "rgba(255,196,60," + a + ")"; g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(hx-1.8, 36); g.lineTo(hx+0.4, 30); g.lineTo(hx-1, 25); g.lineTo(hx+1.2, 19); g.lineTo(hx, 12); g.stroke();
    g.strokeStyle = "rgba(0,0,0,0.5)"; g.lineWidth = 0.4; g.beginPath(); g.moveTo(hx+1.6, 33); g.lineTo(hx+0.6, 27); g.lineTo(hx+1.8, 22); g.stroke(); break; }
  case "leaf":
    g.strokeStyle = "rgba(220,255,200,0.55)"; g.lineWidth = 0.5;
    g.beginPath(); g.moveTo(hx, 37); g.lineTo(hx, 11); g.stroke();
    for(let y = 14; y < 36; y += 4){ g.beginPath(); g.moveTo(hx, y+3); g.lineTo(hx-2.4, y); g.moveTo(hx, y+3); g.lineTo(hx+2.4, y); g.stroke(); } break;
  case "dark": {
    g.strokeStyle = _rgba(c.glow, 0.28); g.lineWidth = 0.9;
    for(let i = 0; i < 3; i++){ g.beginPath(); for(let y = 11; y <= 37; y += 2){ const x = hx + Math.sin(y*0.5 + t*2 + i*2)*1.6; if(y === 11) g.moveTo(x, y); else g.lineTo(x, y); } g.stroke(); } break; }
  case "sea": case "coral":
    g.fillStyle = "rgba(255,255,255,0.35)";
    [[-1.2,33],[1,28],[-0.6,22],[1.2,16],[-1,13]].forEach(function(p){ g.beginPath(); g.arc(hx+p[0], p[1], 0.7, 0, 6.283); g.fill(); });
    g.strokeStyle = "rgba(255,255,255,0.22)"; g.lineWidth = 0.5; g.beginPath(); g.moveTo(hx-2.5, 30); g.quadraticCurveTo(hx, 27, hx+2.5, 30); g.moveTo(hx-2.2, 19); g.quadraticCurveTo(hx, 16, hx+2.2, 19); g.stroke(); break;
  default:
    g.strokeStyle = "rgba(255,255,255,0.2)"; g.lineWidth = 0.5; g.beginPath(); g.moveTo(hx+1, 36); g.lineTo(hx+0.5, 11); g.stroke();
  }
}

function drawRodFancy(g, hx, id, rc){
  const S = ROD_STYLE[id] || {mat:"metal", tip:"ring", grip:"leather", bands:1};
  const t = Date.now()/1000;
  const base = rc.rod || "#888";
  const c = { base: base, hi: _lite(base, 0.55), lo: _dark(base, 0.5), acc: rc.hook || base, glow: rc.glow || _lite(base, 0.5) };
  const yB = 37, yT = 10;
  g.save(); g.lineCap = "round"; g.lineJoin = "round"; g.globalAlpha = 1;

  // ออร่าตามระดับของเบ็ด
  const lk = (typeof rods !== "undefined" && rods[id]) ? rods[id].luck : 0;
  if(rc.glow && lk >= 12){
    const r = 7 + Math.min(lk, 120)/10, a = Math.min(0.12 + lk/320, 0.42) * (0.8 + 0.2*Math.sin(t*2.2));
    _glowDot(g, hx, 17, r + 12, c.glow, a*0.55);
    _glowDot(g, hx, 10, r, c.glow, a);
  }

  // ลำคัน (เรียวเล็กลงไปทางปลาย)
  const body = function(){ g.beginPath(); g.moveTo(hx-2.8, yB); g.lineTo(hx-1.1, yT+1); g.lineTo(hx+1.1, yT+1); g.lineTo(hx+2.8, yB); g.closePath(); };
  body();
  const bg = g.createLinearGradient(hx-2.8, 0, hx+2.8, 0);
  bg.addColorStop(0, c.lo); bg.addColorStop(0.42, base); bg.addColorStop(1, c.hi);
  g.fillStyle = bg; g.fill();
  g.save(); body(); g.clip(); _mat(g, S.mat, hx, c, t); g.restore();
  g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = 0.5; body(); g.stroke();
  g.strokeStyle = "rgba(255,255,255,0.5)"; g.lineWidth = 0.6; g.beginPath(); g.moveTo(hx+2.1, yB-1); g.lineTo(hx+0.9, yT+2); g.stroke();

  // ข้อต่อ/แหวนโลหะ
  const bandY = [31, 23, 16];
  for(let i = 0; i < (S.bands || 0); i++){
    const y = bandY[i], w = 3.2 - i*0.5;
    const q = g.createLinearGradient(hx-w, 0, hx+w, 0);
    q.addColorStop(0, _dark(c.acc, 0.4)); q.addColorStop(0.5, c.acc); q.addColorStop(1, _lite(c.acc, 0.6));
    g.fillStyle = q; g.fillRect(hx-w, y-1.1, w*2, 2.2);
    g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = 0.4; g.strokeRect(hx-w, y-1.1, w*2, 2.2);
  }

  // ด้ามจับ
  const gy0 = 29.5, gh = yB - gy0 + 1;
  const gc = S.grip === "rope" ? ["#d7b98a", "#8d6e3f"] : S.grip === "gold" ? ["#ffe082", "#a67c00"] : S.grip === "scale" ? [_lite(c.acc, 0.2), _dark(c.acc, 0.5)] : ["#6d4c41", "#2b1a14"];
  const gg = g.createLinearGradient(hx-3.4, 0, hx+3.4, 0);
  gg.addColorStop(0, gc[1]); gg.addColorStop(0.6, gc[0]); gg.addColorStop(1, _lite(gc[0], 0.3));
  g.fillStyle = gg; g.fillRect(hx-3.3, gy0, 6.6, gh);
  g.strokeStyle = "rgba(0,0,0,0.38)"; g.lineWidth = 0.55;
  for(let y = gy0; y < yB+1; y += 1.9){ g.beginPath(); g.moveTo(hx-3.3, y+1.4); g.lineTo(hx+3.3, y-0.2); g.stroke(); }
  g.strokeStyle = "rgba(0,0,0,0.5)"; g.lineWidth = 0.5; g.strokeRect(hx-3.3, gy0, 6.6, gh);
  g.fillStyle = _rgrad(g, hx, yB+1.5, 3, _lite(c.acc, 0.5), _dark(c.acc, 0.35));
  g.beginPath(); g.arc(hx, yB+1.6, 2.9, 0, 6.283); g.fill();
  g.strokeStyle = "rgba(0,0,0,0.4)"; g.lineWidth = 0.4; g.stroke();

  // รอก
  const rx = hx + 6.6, ry = 31.5, ang = (typeof fishingState !== "undefined" && fishingState === "biting") ? t*14 : t*0.4;
  g.fillStyle = _dark(c.acc, 0.35); g.fillRect(hx+2.4, ry-1.2, 3, 2.4);
  g.fillStyle = _rgrad(g, rx, ry, 4.6, _lite(c.acc, 0.6), _dark(c.acc, 0.3));
  g.beginPath(); g.arc(rx, ry, 4.1, 0, 6.283); g.fill();
  g.strokeStyle = "rgba(0,0,0,0.55)"; g.lineWidth = 0.9; g.stroke();
  g.strokeStyle = "rgba(0,0,0,0.45)"; g.lineWidth = 0.5;
  for(let i = 0; i < 4; i++){ const a = ang + i*Math.PI/2; g.beginPath(); g.moveTo(rx+Math.cos(a)*0.8, ry+Math.sin(a)*0.8); g.lineTo(rx+Math.cos(a)*3.5, ry+Math.sin(a)*3.5); g.stroke(); }
  g.fillStyle = c.hi; g.beginPath(); g.arc(rx, ry, 1, 0, 6.283); g.fill();
  const hxk = rx + Math.cos(ang)*5.4, hyk = ry + Math.sin(ang)*5.4;
  g.strokeStyle = "rgba(40,40,40,0.9)"; g.lineWidth = 0.8; g.beginPath(); g.moveTo(rx, ry); g.lineTo(hxk, hyk); g.stroke();
  g.fillStyle = c.hi; g.beginPath(); g.arc(hxk, hyk, 1, 0, 6.283); g.fill();

  // ไกด์สายและเส้นสายที่ร้อยขึ้นปลายคัน
  g.strokeStyle = _rgba(rc.line || "#fff", 0.55); g.lineWidth = 0.6;
  g.beginPath(); g.moveTo(rx-3.6, ry-1.4); g.lineTo(hx+3.2, 26.5); g.lineTo(hx+2.9, 20); g.lineTo(hx+2.2, 15); g.lineTo(hx, yT); g.stroke();
  [[26.5, 3.2], [20, 2.9], [15, 2.2]].forEach(function(p){
    g.strokeStyle = c.hi; g.lineWidth = 0.9; g.beginPath(); g.arc(hx+p[1], p[0], 1.3, 0, 6.283); g.stroke();
  });

  // ปลายคัน
  _tip(g, S.tip, hx, yT, c, t);
  g.restore();
}

// ---- เอฟเฟกต์ลอยรอบคัน ----
function _fx(g, name, hx, col, t){
  g.save();
  const n = 6;
  switch(name){
  case "sparkle":
    g.globalCompositeOperation = "lighter";
    for(let i = 0; i < n; i++){
      const a = t*0.9 + i*1.05, r = 7 + ((i*37) % 7);
      const x = hx + Math.cos(a)*r*1.2, y = 20 + Math.sin(a*1.3)*13 - ((i*5) % 6);
      const tw = Math.abs(Math.sin(t*3 + i*1.7)), s = 1 + tw*2.4;
      g.globalAlpha = tw; g.strokeStyle = col; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x-s, y); g.lineTo(x+s, y); g.moveTo(x, y-s); g.lineTo(x, y+s); g.stroke();
    } break;
  case "ember":
    g.globalCompositeOperation = "lighter";
    for(let i = 0; i < n; i++){
      const p = (t*0.5 + i/n) % 1, x = hx + Math.sin(i*5.1 + t*2)*5 + (i % 2 ? 3 : -3)*p, y = 24 - p*22;
      g.globalAlpha = (1-p)*0.9; g.fillStyle = i % 2 ? "#ffb300" : "#ff5722";
      g.beginPath(); g.arc(x, y, 0.5 + (1-p)*1.2, 0, 6.283); g.fill();
    } break;
  case "bubble":
    for(let i = 0; i < 5; i++){
      const p = (t*0.35 + i/5) % 1, x = hx + Math.sin(i*4.3 + t*1.6)*6, y = 36 - p*32, r = 0.9 + (i % 3)*0.6;
      g.globalAlpha = 0.75*(1-p*0.6); g.strokeStyle = "rgba(220,245,255,0.9)"; g.lineWidth = 0.6;
      g.beginPath(); g.arc(x, y, r, 0, 6.283); g.stroke();
      g.fillStyle = "rgba(255,255,255,0.8)"; g.beginPath(); g.arc(x-r*0.3, y-r*0.3, r*0.25, 0, 6.283); g.fill();
    } break;
  case "snow":
    for(let i = 0; i < 7; i++){
      const p = (t*0.3 + i/7) % 1, x = hx + Math.sin(i*3.7 + t*0.9)*10, y = 2 + p*36;
      g.globalAlpha = 0.85; g.fillStyle = "#fff"; g.beginPath(); g.arc(x, y, 0.7 + (i % 3)*0.35, 0, 6.283); g.fill();
    } break;
  case "bolt":
    if(Math.floor(t*7) % 4 === 0){
      let x = hx, y = 9; g.globalCompositeOperation = "lighter";
      for(let k = 0; k < 2; k++){
        g.strokeStyle = k ? "#fff" : col; g.lineWidth = k ? 0.7 : 2; g.globalAlpha = k ? 1 : 0.4;
        g.beginPath(); g.moveTo(x, y);
        let px = x, py = y;
        for(let j = 1; j <= 4; j++){ px = x + ((j*53 + Math.floor(t*7)*17) % 11) - 5; py = y + j*3.4; g.lineTo(px, py); }
        g.stroke();
      }
    } break;
  case "void":
    for(let i = 0; i < 7; i++){
      const p = (t*0.4 + i/7) % 1, r = 16*(1-p) + 2, a = t*2 + i*0.9;
      g.globalAlpha = p*0.85; g.fillStyle = col;
      g.beginPath(); g.arc(hx + Math.cos(a)*r, 14 + Math.sin(a)*r*0.7, 0.9, 0, 6.283); g.fill();
    } break;
  case "firefly":
    g.globalCompositeOperation = "lighter";
    for(let i = 0; i < 4; i++){
      const x = hx + Math.sin(t*0.8 + i*2)*12, y = 22 + Math.cos(t*0.6 + i*3)*10, a = 0.4 + 0.6*Math.abs(Math.sin(t*2 + i));
      _glowDot(g, x, y, 5, "#c6ff00", a*0.8);
      g.fillStyle = "rgba(255,255,200," + a + ")"; g.beginPath(); g.arc(x, y, 0.8, 0, 6.283); g.fill();
    } break;
  case "leaf":
    for(let i = 0; i < 3; i++){
      const p = (t*0.18 + i/3) % 1, x = hx + Math.sin(i*2.5 + t)*9, y = 4 + p*34;
      g.save(); g.translate(x, y); g.rotate(t*1.5 + i); g.globalAlpha = 0.85;
      g.fillStyle = i % 2 ? "#7cb342" : "#aed581"; g.beginPath(); g.ellipse(0, 0, 1.8, 0.8, 0, 0, 6.283); g.fill(); g.restore();
    } break;
  case "dust":
    for(let i = 0; i < 6; i++){
      const p = (t*0.12 + i/6) % 1, x = hx - 14 + p*28, y = 14 + Math.sin(i*2.1 + t*0.7)*10;
      g.globalAlpha = Math.sin(p*Math.PI)*0.6; g.fillStyle = "#d7b98a"; g.beginPath(); g.arc(x, y, 0.8, 0, 6.283); g.fill();
    } break;
  case "rays":
    g.globalCompositeOperation = "lighter"; g.translate(hx, 10); g.rotate(t*0.4);
    for(let i = 0; i < 8; i++){
      g.rotate(Math.PI/4); g.globalAlpha = 0.28 + 0.12*Math.sin(t*2 + i);
      const q = g.createLinearGradient(0, 0, 0, -16); q.addColorStop(0, col); q.addColorStop(1, _rgba(col, 0));
      g.fillStyle = q; g.beginPath(); g.moveTo(-1, -2); g.lineTo(1, -2); g.lineTo(0.3, -16); g.lineTo(-0.3, -16); g.closePath(); g.fill();
    } break;
  case "feather":
    for(let i = 0; i < 4; i++){
      const p = (t*0.2 + i/4) % 1, x = hx + Math.sin(i*3.1 + t*1.1)*9, y = 3 + p*34;
      g.save(); g.translate(x, y); g.rotate(Math.sin(t + i)*0.9); g.globalAlpha = 0.8*(1-p*0.5);
      g.fillStyle = "#fff8e1"; g.beginPath(); g.ellipse(0, 0, 2.6, 0.9, 0, 0, 6.283); g.fill();
      g.strokeStyle = "rgba(255,193,7,0.7)"; g.lineWidth = 0.4; g.beginPath(); g.moveTo(-2.6, 0); g.lineTo(2.6, 0); g.stroke(); g.restore();
    } break;
  case "ghost":
    for(let i = 0; i < 3; i++){
      const p = (t*0.3 + i/3) % 1, x0 = hx + (i-1)*7, y0 = 36 - p*30;

    rc.glow = wheelCols[(t+1)%wheelCols.length];
  }

  if(currentRod===50){ Object.assign(rc, getRodColors(50)); }

  // เรืองแสงรอบเบ็ด (เบ็ดระดับสูง)
  if(rc.glow && !ROD_STYLE[currentRod] && currentRod!==50){

  // ตกแต่งถ้ำน้ำวน
  if(currentLoc===9){
    const t = Date.now()/800;
    // วงน้ำวน
    for(let i=3;i>=1;i--){

    // ผลึกเรือง

    ctx.beginPath(); ctx.moveTo(canvas.width-22, canvas.height*0.4); ctx.lineTo(canvas.width-14, canvas.height*0.36); ctx.lineTo(canvas.width-16, canvas.height*0.46); ctx.fill();

  // ตกแต่งแท่นเสริมพลัง
  if(currentLoc===10){
    const t = Date.now()/700;

  // ตกแต่งเกาะลาวา จัดเต็ม + ภูเขาไฟ + เปลวไฟ + แสงเงา
  if(currentLoc===11){

    // ลาวาไหลลงภูเขา

    // เถ้าถ่าน / ประกายลอย
    for(let i=0;i<16;i++){

      ctx.fillStyle = i%3===0

    // แสงสะท้อนบนน้ำสีลาวา

  // ตกแต่งเกาะโบราณ
  if(currentLoc===8){

    ctx.moveTo(70, 45);
    ctx.lineTo(120, 130);
    ctx.lineTo(80, 130);

    ctx.fill();

    for(let i=0;i<4;i++){

    ctx.beginPath(); ctx.moveTo(W-48, 60); ctx.lineTo(W-52, 100); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-24, 55); ctx.lineTo(W-20, 110); ctx.stroke();

    // รูนเรืองแสงบนเสา
    ctx.fillStyle = `rgba(255,193,7,${0.4+0.35*Math.sin(t*2)})`;

    // ไฟโบราณบนแท่น
    const fx = W*0.5, fy = 128;
    for(let i=0;i<5;i++){

      ctx.beginPath();

  // ตกแต่งเกาะสายรุ้ง
  if(currentLoc===12){

  // ตกแต่งหุบเขาออบซิเดียน
  if(currentLoc===13){

      ctx.fill();

  }

  // ตกแต่งทะเลเมฆ
  if(currentLoc===14){
    const t = Date.now()/1000;
    // เมฆก้อนใหญ่
    function cloud(x,y,s,a){
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(x, y, 16*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+18*s, y-6*s, 14*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+32*s, y+2*s, 12*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+12*s, y+8*s, 13*s, 0, Math.PI*2); ctx.fill();
    }
    cloud(40+Math.sin(t)*10, 45, 1.2, 0.85);

    // แสงซึมผ่านเมฆ
    const sg = ctx.createRadialGradient(200, 40, 5, 200, 60, 120);
    sg.addColorStop(0, "rgba(255,255,255,0.25)");
    sg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, canvas.width, 120);
    // เกาะลอยเล็ก
    ctx.fillStyle = "#a5d6a7";
    ctx.beginPath(); ctx.ellipse(80, 110, 35, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#66bb6a";
    ctx.beginPath(); ctx.arc(70, 100, 10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(90, 98, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#81c784";
    ctx.beginPath(); ctx.ellipse(280, 120, 28, 10, 0, 0, Math.PI*2); ctx.fill();
  }

  drawRodSet(currentRod, boatX, hookY, rc);

function startCast(){
  if(fishingState==="castAim"){
    // ปล่อยจากกดค้าง = เหวี่ยง
    return;
  }
  if(fishingState!=="idle")return;
  if(currentLoc===10){
    openEnchantPanel();
    return;
  }
  if(getTotalFish()>=maxBag){showMessage(msg("กระเป๋าเต็ม!\nไปขายปลาก่อน","Bag full!\nSell fish first"),2000);return}
  if(baits[currentBait].owned<=0&&currentBait!==0){showMessage(msg("เหยื่อหมดแล้ว!","Out of bait!"),1600);return}

  // แบบ Fisch: กดค้างเติมแรง ปล่อยเพื่อเหวี่ยง
  fishingState="castAim";
  castPos=0; castDir=1; castSpeed=2.4;
  castBtn.textContent=msg("ปล่อยเพื่อเหวี่ยง!","Release to cast!");
  const castUI=document.getElementById("castUI");
  const castMarker=document.getElementById("castMarker");
  const castZone=document.getElementById("castZone");
  const castHint=document.getElementById("castHint");
  const castTitle=document.getElementById("castTitle");
  if(castUI) castUI.style.display="block";
  if(castTitle) castTitle.textContent=msg("แรงเหวี่ยง (กดค้าง)","Cast power (hold)");
  if(castHint) castHint.textContent=msg("กดค้างให้แถบแดงอยู่ในโซนเหลือง แล้วปล่อย!","Hold so the red bar is in the yellow zone, then release!");
  if(castZone){ castZone.style.left="38%"; castZone.style.width="24%"; }

  if(castTimer) clearInterval(castTimer);
  castTimer=setInterval(()=>{
    if(fishingState!=="castAim"){ clearInterval(castTimer); return; }
    castPos += castDir * castSpeed;
    if(castPos>=100){ castPos=100; castDir=-1; }
    if(castPos<=0){ castPos=0; castDir=1; }
    if(castMarker) castMarker.style.left = castPos + "%";
  }, 25);
}

function releaseCast(){
  if(fishingState!=="castAim") return;
  if(castTimer){ clearInterval(castTimer); castTimer=null; }
  const castUI=document.getElementById("castUI");
  if(castUI) castUI.style.display="none";

  const zoneL=38, zoneR=62;
  let quality=0;
  if(castPos>=zoneL && castPos<=zoneR){
    const mid=50;
    const dist=Math.abs(castPos-mid);
    quality = Math.max(0.6, Math.min(1, 1 - dist/14));
    showMessage(msg("เหวี่ยงดี! "+Math.round(quality*100)+"%","Nice cast! "+Math.round(quality*100)+"%"), 1100);
    SFX.reel();
  } else {
    const dist=castPos<zoneL ? (zoneL-castPos) : (castPos-zoneR);
    quality = Math.max(0.2, 0.55 - dist/70);
    showMessage(msg("เหวี่ยงไม่ตรงจังหวะ "+Math.round(quality*100)+"%","Off timing "+Math.round(quality*100)+"%"), 1100);
    SFX.fail();
  }
  castQuality = quality;

  SFX.cast();
  fishingState="casting";
  castBtn.disabled=true;
  castBtn.textContent=msg("กำลังเหวี่ยง...","Casting...");

  let drop=setInterval(()=>{
    hookY+=10;
    if(hookY>260){
      clearInterval(drop);
      fishingState="waiting";
      castBtn.textContent=msg("รอปลากิน...","Waiting...");
      showMessage(msg("รอปลากินเหยื่อ...","Waiting for a bite..."),1400);
      const wait = (2200 - castQuality*900) + Math.random()*1600;
      biteTimeout=setTimeout(startBite, Math.max(700, wait));
    }
    draw();
  },25);
}

function finishCastAim(){ releaseCast(); }

// เก็บปลาที่กำลังกัดเบ็ดไว้
let pendingFish = null;
let isBossFight = false;


function getActiveRodStats(){
  const r = rods[currentRod] || rods[0];
  const en = rodEnchants[currentRod];
  return {
    luck: (r.luck||0) + (en ? (en.luck||0) : 0),
    reel: (r.reel||5) + (en ? (en.reel||0) : 0),
    mult: (r.mult||1) * (1 + (en ? (en.mult||0) : 0)),
    maxWeight: r.maxWeight||50,
    name: r.name
  };
}

function startBite(){
  fishingState="biting";
  pendingFish = null;
  isBossFight = false;
  isFightingMega = false;

  const loc = locations[currentLoc];
  const weather = weathers[currentWeather];

  // สุ่มว่าเป็นบอสหรือไม่
  // เกาะโบราณ (index 8) ตกเมกาโลดอนได้แม้กิจกรรมยังไม่เริ่ม
  const _admFish = admidPickFish();   // 👑 เบ็ด ADMID เลือกปลาได้ทั้งเกม
  if(_admFish){
    pendingFish = _admFish;
    if(_admFish.name === "ฉลามเมกาโลดอน"){ isFightingMega = true; isBossFight = true; }
    else if(_admFish.rarity === "บอส"){ isBossFight = true; }
  } else if((megaEventActive && Math.random() < 0.01) || (currentLoc === 8 && Math.random() < 0.18)){
    const megaPrice = Math.floor(50000 + Math.random() * 450000);
    pendingFish = {name:"ฉลามเมกาโลดอน",rarity:"บอส",price:megaPrice,exp:Math.floor(megaPrice/40),chance:0};
    isFightingMega = true;
    isBossFight = true;
  } else if(Math.random()*100 < (2.8 * weather.bossChance) && loc.fish.some(f=>f.rarity==="บอส")){
    const bosses = loc.fish.filter(f=>f.rarity==="บอส");
    pendingFish = bosses[Math.floor(Math.random()*bosses.length)];
    isBossFight = true;
  } else {
    // เลือกปลาล่วงหน้า เพื่อคำนวณแรงดึงตามน้ำหนัก
    const rod=rods[currentRod], bait=baits[currentBait];
    let adjusted=loc.fish.filter(f=>f.rarity!=="บอส").map(f=>{
      let ch=f.chance;
      if(f.rarity!=="ธรรมดา"){ const _rs=getActiveRodStats(); ch+=_rs.luck+bait.rareBonus+weather.rareBonus+(isDay?0:5)+(castQuality>0.7?castQuality*6:0); ch=Math.max(0.1,ch); }
      return {...f,chance:ch};
    });
    const total=adjusted.reduce((s,f)=>s+f.chance,0)||1;
    adjusted=adjusted.map(f=>({...f,chance:(f.chance/total)*100}));
    const rand=Math.random()*100;let cum=0;
    for(let f of adjusted){cum+=f.chance;if(rand<=cum){pendingFish=f;break}}
    if(!pendingFish && adjusted.length) pendingFish=adjusted[0];
  }

  // ประมาณน้ำหนักเพื่อกำหนดแรงดึง
  const sizeEst=0.7+Math.random()*0.9;
  if(pendingFish){
    if(pendingFish.name==="ฉลามเมกาโลดอน") fightWeightEst = 10000 + Math.random()*40000;
    else if(pendingFish.rarity==="บอส") fightWeightEst = Math.max((pendingFish.price||5000)/8*sizeEst, 5000*sizeEst);
    else if(pendingFish.rarity==="ตำนาน") fightWeightEst = Math.max((pendingFish.price||500)/8*sizeEst, 800*sizeEst);
    else if(pendingFish.rarity==="มหากาพย์") fightWeightEst = Math.max((pendingFish.price||200)/10*sizeEst, 200*sizeEst);
    else if(pendingFish.rarity==="หายาก") fightWeightEst = Math.max((pendingFish.price||50)/10*sizeEst, 40*sizeEst);
    else fightWeightEst = Math.max((pendingFish.price||10)/10*sizeEst, 5*sizeEst);
  } else {
    fightWeightEst = 10;
  }

  // แรงดึงตามน้ำหนัก + ค่ารีลของเบ็ด (reel สูง = ดึงง่ายขึ้น)
  // ค่ารีลช่วยได้บ้าง แต่ไม่ง่ายเกิน (เบ็ดดีช่วยเล็กน้อย)
  const rodReel = getActiveRodStats().reel;
  const reelBoost = 1 + (rodReel / 140);  // max ~1.71 ที่ reel 100
  const reelEase = 1 + (rodReel / 180);   // max ~1.56 ที่ reel 100

  if(isFightingMega){
    const w = Math.max(10000, fightWeightEst);
    const megaFactor = Math.min(1, (w - 10000) / 40000);
    currentDrainSpeed = (5.2 + megaFactor * 2.6) / reelEase;
    currentReelAdd = (2.4 - megaFactor * 1.0) * reelBoost;
    reelProgress = Math.max(5, 9 - megaFactor * 4);
  } else if(isBossFight){
    const w = Math.max(1000, fightWeightEst);
    const bossFactor = Math.min(1, Math.log10(w) / 5);
    currentDrainSpeed = (4.5 + bossFactor * 1.3) / reelEase;
    currentReelAdd = (2.5 - bossFactor * 0.4) * reelBoost;
    reelProgress = 7;
  } else {
    const w = Math.max(1, fightWeightEst);
    const weightFactor = Math.min(4.5, Math.log10(w + 10) * 1.15);
    currentDrainSpeed = (1.35 + weightFactor * 0.75) / reelEase;
    currentReelAdd = Math.max(2.4, (9.8 - weightFactor * 1.55) * reelBoost);
    reelProgress = Math.max(10, 26 - weightFactor * 3);
  }
  currentDrainSpeed = Math.max(0.9, currentDrainSpeed);
  currentReelAdd = Math.min(12, Math.max(1.4, currentReelAdd));
  reelProgress = Math.min(32, Math.max(5, reelProgress));
  // เหวี่ยงดี → เริ่มหลอดสูงขึ้นเล็กน้อย
  reelProgress = Math.min(40, reelProgress + castQuality * 10);


  if(isBossFight && pendingFish){
    biteText.textContent = "🔥 " + tn(pendingFish.name) + (currentLang==="en" ? " is biting!!!" : " กินแล้ว!!!");
    biteText.style.color = "#ff1744";
    SFX.bossBite();
  } else {
    biteText.textContent = currentLang==="en" ? "Fish is biting!!!" : "ปลากินแล้ว!!!";
    biteText.style.color = "#ffeb3b";
    SFX.bite();
  }

  fishingUI.style.display="block";
  reelBtn.style.display="block";
  reelBar.style.width = reelProgress + "%";
  castBtn.textContent = t("pullFish");
  if(timingHint){
    timingHint.textContent = currentLang==="en"
      ? "Tap the button to fill the bar!"
      : "กดปุ่มดึงเพื่อเติมหลอด!";
  }
  // ซ่อนแถบตามปลา (ระบบเดิมไม่ใช้)
  const track=document.getElementById("timingTrack");
  if(track) track.style.display="none";

  startRodSkills();

  if(timingTimer){ clearInterval(timingTimer); timingTimer=null; }
  isHoldingReel=false;

  // ปลาไม่หลุดเองตามเวลา — หลุดเมื่อหลอดหมด หรือจับได้เมื่อหลอดเต็ม
  reelTimer = setInterval(()=>{
    reelProgress = Math.max(0, reelProgress - currentDrainSpeed);
    reelBar.style.width = reelProgress + "%";
    if(reelProgress <= 0){
      clearInterval(reelTimer);
      failCatch();
    }
  }, 100);
}

function doReel(){
  if(fishingState !== "biting") return;
  SFX.reel();
  const addAmount = currentReelAdd || 8.5;
  reelProgress = Math.min(100, reelProgress + addAmount);
  reelBar.style.width = reelProgress + "%";
  if(reelProgress >= 100){
    clearInterval(reelTimer);
    if(timingTimer){ clearInterval(timingTimer); timingTimer=null; }
    successCatch();
  }
}
function releaseReel(){
  isHoldingReel = false;
}

    hammer = document.createElement('div');
    hammer.id = 'hammerDrop';

  if(!impact){
    impact = document.createElement('div');
    impact.id = 'hammerImpact';
    document.body.appendChild(impact);
  }
  if(hammer.parentElement !== document.body) document.body.appendChild(hammer);
  if(impact.parentElement !== document.body) document.body.appendChild(impact);

  // ตำแหน่งกระทบ = กลางหลอดดึง
  let impactLeft = window.innerWidth * 0.5;
  let impactTop = window.innerHeight * 0.75;
  if(bg){
    const rect = bg.getBoundingClientRect();
    impactLeft = rect.left + rect.width/2;
    impactTop = rect.top + rect.height * 0.3;
  }
  impact.style.left = impactLeft + 'px';
  impact.style.top = impactTop + 'px';
  impact.style.marginLeft = '0';
  impact.style.transform = 'translateX(-50%)';

  // ค้อนเหวี่ยงจากขวา (animation ใช้ right)
  hammer.style.left = 'auto';
  hammer.style.right = '-40px';
  hammer.style.top = '18%';
  hammer.style.bottom = 'auto';
  hammer.style.display = 'block';
  hammer.style.animation = 'none';
  void hammer.offsetWidth;
  hammer.style.animation = 'hammerSwing .6s cubic-bezier(.25,.8,.3,1.05) forwards';

  setTimeout(()=>{
    impact.style.display = 'block';
    impact.style.animation = 'none';
    void impact.offsetWidth;
    impact.style.animation = 'hammerImpactFx .4s ease-out forwards';
    if(bg){
      bg.classList.remove('fx-hammer');
      void bg.offsetWidth;
      bg.classList.add('fx-hammer');
      setTimeout(()=>bg.classList.remove('fx-hammer'), 450);
    }
    SFX.hammer();
  }, 380);

  setTimeout(()=>{
    hammer.style.display = 'none';
    impact.style.display = 'none';
  }, 700);
}
