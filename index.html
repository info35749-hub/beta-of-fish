<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>BeTa of Fish</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
  body{background:#0a0a0a;color:#ffebee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden;touch-action:none}
  h1{font-size:1.25rem;margin:6px 0 4px;color:#ff1744;text-shadow:0 0 12px rgba(255,23,68,0.55);letter-spacing:0.5px}
  #topInfo{display:flex;gap:7px;font-size:.78rem;margin-bottom:4px;flex-wrap:wrap;justify-content:center}
  #topInfo div{background:rgba(40,0,0,0.75);border:1px solid #b71c1c;padding:4px 8px;border-radius:8px;color:#ffcdd2}
  input{user-select:text;-webkit-user-select:text}
  canvas{background:linear-gradient(#2b0000,#0a0a0a);border-radius:12px;border:3px solid #c62828;max-width:96vw;display:block;box-shadow:0 0 18px rgba(198,40,40,0.35)}
  .btn-row{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;justify-content:center;padding:0 3px}
  .btn{background:linear-gradient(180deg,#c62828,#7f0000);border:1px solid #ff5252;border-radius:9px;color:#fff;font-size:.8rem;font-weight:bold;padding:8px 10px;min-width:64px;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
  .btn:active{transform:scale(.95);filter:brightness(1.15)}
  #castBtn{background:linear-gradient(180deg,#ff1744,#b71c1c);min-width:90px;border-color:#ff8a80}
  #castBtn:disabled{background:#333;border-color:#555;color:#888}
  #locationBtn{background:linear-gradient(180deg,#d32f2f,#6a0000)}
  #shopBtn{background:linear-gradient(180deg,#ff5252,#c62828);color:#fff}
  #questBtn{background:linear-gradient(180deg,#e53935,#8e0000)}
  #bookBtn{background:linear-gradient(180deg,#b71c1c,#4a0000)}
  #statBtn{background:linear-gradient(180deg,#424242,#1a1a1a);border-color:#757575}
  #craftBtn{background:linear-gradient(180deg,#6d1b1b,#2a0000)}
  #invBtn{background:linear-gradient(180deg,#c62828,#5d0000)!important}
  #settingsBtn{background:linear-gradient(180deg,#37474f,#102027)!important;border:1px solid #78909c}
  #panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,0,0,.94);z-index:30;padding:12px;overflow-y:auto}
  #panel h2{margin-bottom:8px;font-size:1.15rem;color:#ff1744;text-shadow:0 0 8px rgba(255,23,68,0.4)}
  .section-title{margin:12px 0 6px;font-size:.95rem;color:#ff8a80;border-left:3px solid #ff1744;padding-left:8px}
  .item{background:linear-gradient(90deg,#1a0505,#2a0a0a);margin:4px 0;padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:5px;border:1px solid #5d1010}
  .item-info{flex:1}
  .item-name{font-weight:bold;font-size:.9rem;color:#ffebee}
  .item-sub{font-size:.75rem;color:#ef9a9a}
  .buy-btn,.sell-btn,.equip-btn,.claim-btn{border:none;border-radius:6px;padding:5px 9px;font-size:.75rem;font-weight:bold;white-space:nowrap}
  .buy-btn{background:#c62828;color:#fff}
  .sell-btn{background:#ff6f00;color:#fff}
  .equip-btn{background:#424242;color:#fff;border:1px solid #e0e0e0}
  .claim-btn{background:#d50000;color:#fff}
  .claim-btn:disabled{background:#333;color:#777}
  .closeBtn{background:linear-gradient(180deg,#ff1744,#9a0007);border:1px solid #ff8a80;color:#fff;padding:10px;border-radius:8px;margin-top:12px;font-size:.95rem;width:100%;font-weight:bold}
  #message{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(20,0,0,.9);padding:10px 14px;border-radius:9px;font-size:.95rem;display:none;z-index:5;text-align:center;border:1px solid #ff1744;color:#ffebee;box-shadow:0 0 20px rgba(255,23,68,0.35)}
  #weatherInfo{font-size:.8rem;color:#ef9a9a;margin-bottom:3px}
  #fishingUI{display:none;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:90%;max-width:310px;z-index:8;text-align:center}
  #biteText{font-size:1.1rem;font-weight:bold;color:#ff1744;margin-bottom:6px;text-shadow:0 0 8px #000,0 0 12px #ff1744}
  #reelBarBg{position:relative;background:#1a1a1a;height:18px;border-radius:10px;overflow:visible;border:2px solid #ff5252;margin-top:8px;box-shadow:0 0 10px rgba(255,23,68,0.25)}
  #reelBar{background:linear-gradient(90deg,#b71c1c,#ff1744,#ff8a80);height:100%;width:0%;transition:width .08s linear;border-radius:8px}
  #skillFxLayer{position:absolute;left:0;top:-28px;width:100%;height:28px;pointer-events:none;overflow:visible;text-align:center;font-size:1.1rem;font-weight:bold;text-shadow:0 0 8px #000}
  #reelBarBg.fx-hammer{box-shadow:0 0 18px 6px #29b6f6,0 0 40px #01579b;border-color:#81d4fa;animation:hammerPulse .35s ease}
  #reelBarBg.fx-hammer #reelBar{background:linear-gradient(90deg,#0288d1,#4fc3f7,#e1f5fe)}
  #reelBarBg.fx-trident{box-shadow:0 0 18px 6px #ffd700,0 0 40px #ff8f00;border-color:#ffe082;animation:tridentFlash .3s ease}
  #reelBarBg.fx-trident #reelBar{background:linear-gradient(90deg,#ff8f00,#ffd700,#fff59d)}
  #reelBarBg.fx-void{box-shadow:0 0 22px 8px #ff6d00,0 0 50px #fff,0 0 80px #ff3d00;border-color:#ffab40;animation:voidPulse .4s ease}
  #reelBarBg.fx-void #reelBar{background:linear-gradient(90deg,#212121,#ff6d00,#fff,#ff6d00)}
  @keyframes hammerPulse{0%{transform:scaleY(1)}40%{transform:scaleY(1.45)}100%{transform:scaleY(1)}}
  @keyframes tridentFlash{0%{filter:brightness(1)}50%{filter:brightness(1.8)}100%{filter:brightness(1)}}
  @keyframes voidPulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  .skill-pop{display:inline-block;animation:skillPop .7s ease forwards}
  @keyframes skillPop{0%{opacity:0;transform:translateY(8px) scale(.6)}30%{opacity:1;transform:translateY(-4px) scale(1.2)}100%{opacity:0;transform:translateY(-18px) scale(1)}}
  #sunBeam{
    display:none;position:fixed;left:50%;top:0;width:14px;height:0;
    transform:translateX(-50%);
    background:linear-gradient(180deg,
      rgba(255,255,220,1) 0%,
      rgba(255,235,59,0.95) 8%,
      rgba(255,171,64,0.9) 35%,
      rgba(255,109,0,0.85) 70%,
      rgba(255,60,0,0.5) 90%,
      rgba(255,40,0,0) 100%);
    box-shadow:0 0 18px 6px rgba(255,160,0,0.9),0 0 40px 14px rgba(255,100,0,0.55),0 0 70px 20px rgba(255,60,0,0.25);
    border-radius:8px;z-index:100;pointer-events:none;
    animation:sunBeamStrike .5s ease-out forwards;
  }
  #sunBeam::before{
    content:"";position:absolute;left:50%;top:-6px;width:36px;height:36px;
    transform:translateX(-50%);
    background:radial-gradient(circle,#ffffff 0%,#fff59d 30%,#ff6d00 65%,transparent 100%);
    border-radius:50%;
    box-shadow:0 0 24px 10px rgba(255,200,50,0.9),0 0 48px 16px rgba(255,120,0,0.5);
  }
  #sunBeam::after{
    content:"";position:absolute;left:50%;bottom:-4px;width:70px;height:24px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(255,200,80,1) 0%,rgba(255,100,0,0.6) 45%,transparent 70%);
    border-radius:50%;
    box-shadow:0 0 30px 12px rgba(255,140,0,0.7);
  }
  @keyframes sunBeamStrike{
    0%{opacity:0;height:0}
    20%{opacity:1;height:35vh}
    55%{opacity:1;height:70vh}
    100%{opacity:0;height:75vh}
  }
  #reelBarBg.fx-sun{box-shadow:0 0 22px 8px #ff6d00,0 0 50px #ffab40;border-color:#ffab40;animation:voidPulse .35s ease}
  #reelBarBg.fx-sun #reelBar{background:linear-gradient(90deg,#e65100,#ff6d00,#ffeb3b,#ff6d00)}
  #seraphicBeam{
    display:none;position:fixed;left:50%;top:0;width:12px;height:0;
    transform:translateX(-50%);
    background:linear-gradient(180deg,
      rgba(255,255,255,1) 0%,
      rgba(255,245,157,0.95) 10%,
      rgba(255,215,0,0.9) 40%,
      rgba(255,193,7,0.75) 75%,
      rgba(255,200,50,0) 100%);
    box-shadow:0 0 16px 6px rgba(255,215,0,0.9),0 0 36px 12px rgba(255,235,59,0.5);
    border-radius:8px;z-index:100;pointer-events:none;
    animation:sunBeamStrike .5s ease-out forwards;
  }
  #seraphicBeam::before{
    content:"";position:absolute;left:50%;top:-8px;width:28px;height:28px;
    transform:translateX(-50%);
    background:radial-gradient(circle,#fff 0%,#ffd700 45%,transparent 70%);
    border-radius:50%;
    box-shadow:0 0 20px 8px rgba(255,215,0,0.85);
  }
  #reelBarBg.fx-seraph{box-shadow:0 0 22px 8px #ffd700,0 0 45px #fff59d;border-color:#ffe082;animation:tridentFlash .35s ease}
  #reelBarBg.fx-seraph #reelBar{background:linear-gradient(90deg,#f9a825,#ffd700,#fffde7,#ffd700)}
  
  #zenithOrbit{
    display:none;position:fixed;left:50%;z-index:99;pointer-events:none;
    width:200px;height:200px;margin-left:-100px;margin-top:-100px;
  }
  #zenithOrbit .zrod{
    position:absolute;left:50%;top:50%;width:36px;height:52px;
    margin-left:-18px;margin-top:-26px;
    animation:zenithSpin 3s linear infinite;
    filter:drop-shadow(0 0 6px currentColor);
  }
  #zenithOrbit .zrod canvas{
    width:36px;height:52px;display:block;
  }
  #zenithOrbit .zcenter{
    position:absolute;left:50%;top:50%;width:48px;height:70px;
    margin-left:-24px;margin-top:-35px;
    filter:drop-shadow(0 0 12px #ce93d8) drop-shadow(0 0 20px #7e57c2);
    animation:zenithPulse 1.2s ease-in-out infinite;
    z-index:2;
  }
  #zenithOrbit .zcenter canvas{
    width:48px;height:70px;display:block;
  }
  @keyframes zenithPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }
  @keyframes zenithSpin{
    from{ transform: rotate(0deg) translateX(78px) rotate(0deg); }
    to{ transform: rotate(360deg) translateX(78px) rotate(-360deg); }
  }
  #luminSlash{
    display:none;position:fixed;left:50%;z-index:100;pointer-events:none;
    width:70px;height:130px;margin-left:-35px;
    animation:luminFall .5s ease-in forwards;
  }
  #luminSlash svg{width:100%;height:100%;filter:drop-shadow(0 0 14px #40c4ff) drop-shadow(0 0 28px #0277bd)}
  @keyframes luminFall{
    0%{ top: -20%; opacity:0; transform: rotate(-25deg) scale(0.6); }
    30%{ opacity:1; top: 30%; transform: rotate(-10deg) scale(1.05); }
    60%{ top: var(--lumin-target, 55%); transform: rotate(5deg) scale(1.2); }
    80%{ top: var(--lumin-target, 55%); transform: rotate(-3deg) scale(1.1); }
    100%{ top: var(--lumin-target, 55%); opacity:0; transform: rotate(0deg) scale(1); }
  }
  #reelBarBg.fx-lumin{
    box-shadow:0 0 26px 12px #40c4ff,0 0 55px #81d4fa;
    border-color:#e3f2fd;
    animation:megaBarHit .35s ease;
  }
  #reelBarBg.fx-lumin #reelBar{background:linear-gradient(90deg,#0277bd,#40c4ff,#e3f2fd,#40c4ff)}
  #ruinousSlash{
    display:none;position:fixed;left:50%;z-index:100;pointer-events:none;
    width:70px;height:130px;margin-left:-35px;
    animation:ruinousFall .5s ease-in forwards;
  }
  #ruinousSlash svg{width:100%;height:100%;filter:drop-shadow(0 0 14px #ff1744) drop-shadow(0 0 28px #b71c1c)}
  @keyframes ruinousFall{
    0%{ top: -20%; opacity:0; transform: rotate(-25deg) scale(0.6); }
    30%{ opacity:1; top: 30%; transform: rotate(-10deg) scale(1.05); }
    60%{ top: var(--ruin-target, 55%); transform: rotate(5deg) scale(1.2); }
    80%{ top: var(--ruin-target, 55%); transform: rotate(-3deg) scale(1.1); }
    100%{ top: var(--ruin-target, 55%); opacity:0; transform: rotate(0deg) scale(1); }
  }
  #reelBarBg.fx-ruinous{
    box-shadow:0 0 26px 12px #ff1744,0 0 55px #ff5252;
    border-color:#ff8a80;
    animation:megaBarHit .35s ease;
  }
  #reelBarBg.fx-ruinous #reelBar{background:linear-gradient(90deg,#b71c1c,#ff1744,#ffeb3b,#ff1744)}
  #noLifeKey{
    display:none;position:fixed;left:50%;z-index:100;pointer-events:none;
    width:90px;height:90px;margin-left:-45px;
    animation:noLifeSpin .55s ease-out forwards;
  }
  #noLifeKey svg{width:100%;height:100%;filter:drop-shadow(0 0 12px #ff1744) drop-shadow(0 0 24px #b71c1c)}
  @keyframes noLifeSpin{
    0%{ opacity:0; transform: scale(0.4) rotate(-90deg); }
    25%{ opacity:1; transform: scale(1.1) rotate(20deg); }
    55%{ transform: scale(1.25) rotate(200deg); }
    80%{ transform: scale(1.1) rotate(340deg); }
    100%{ opacity:0; transform: scale(0.9) rotate(360deg); }
  }
  #reelBarBg.fx-nolife{
    box-shadow:0 0 24px 10px #ff1744,0 0 50px #c62828;
    border-color:#ff8a80;
    animation:voidPulse .35s ease;
  }
  #reelBarBg.fx-nolife #reelBar{background:linear-gradient(90deg,#b71c1c,#ff1744,#ff8a80,#ff1744)}

  #megaBite{
    display:none;position:fixed;left:50%;z-index:100;pointer-events:none;
    width:180px;height:100px;margin-left:-90px;
    animation:megaLunge .6s cubic-bezier(.2,.85,.3,1.05) forwards;
  }
  #megaBite svg{width:100%;height:100%;filter:drop-shadow(0 0 14px #00e5ff) drop-shadow(0 6px 18px #006064)}
  @keyframes megaLunge{
    0%{
      top: 110%;
      opacity: 0;
      transform: scale(0.5) rotate(12deg);
    }
    20%{
      opacity: 1;
      top: 70%;
      transform: scale(0.9) rotate(6deg);
    }
    50%{
      top: var(--mega-target, 60%);
      transform: scale(1.35) rotate(-4deg);
    }
    65%{
      top: var(--mega-target, 60%);
      transform: scale(1.45) rotate(0deg);
    }
    80%{
      top: var(--mega-target, 60%);
      transform: scale(1.2) rotate(2deg);
    }
    100%{
      top: var(--mega-target, 60%);
      opacity: 0;
      transform: scale(1.1) rotate(0deg);
    }
  }
  #megaBite.impact-shake{
    animation: megaLunge .6s cubic-bezier(.2,.85,.3,1.05) forwards, megaShake .15s ease-in-out 0.35s 2;
  }
  @keyframes megaShake{
    0%,100%{ margin-left:-90px; }
    50%{ margin-left:-96px; }
  }
  #reelBarBg.fx-mega{
    box-shadow:0 0 28px 12px #00e5ff,0 0 55px #00bcd4,0 0 80px rgba(0,229,255,0.4);
    border-color:#e0f7fa;
    animation:megaBarHit .4s ease;
  }
  #reelBarBg.fx-mega #reelBar{background:linear-gradient(90deg,#004d40,#00e5ff,#e0f7fa,#00bcd4,#006064)}
  @keyframes megaBarHit{
    0%{ transform:scaleY(1); }
    30%{ transform:scaleY(1.35); filter:brightness(1.4); }
    60%{ transform:scaleY(0.95); }
    100%{ transform:scaleY(1); filter:brightness(1); }
  }
  #hammerDrop{
    display:none;position:fixed;right:-40px;top:18%;z-index:100;pointer-events:none;
    width:70px;height:110px;
    transform-origin: 50% 0%;
    filter:drop-shadow(0 0 10px #4fc3f7) drop-shadow(0 6px 18px #01579b);
    animation:hammerSwing .6s cubic-bezier(.25,.8,.3,1.05) forwards;
  }
  #hammerDrop .h-head{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:58px;height:28px;
    background:linear-gradient(180deg,#e1f5fe 0%,#4fc3f7 40%,#0277bd 100%);
    border-radius:6px 6px 4px 4px;
    border:2px solid #81d4fa;
    box-shadow:inset 0 2px 0 rgba(255,255,255,0.5),0 0 12px #29b6f6;
  }
  #hammerDrop .h-head::before,
  #hammerDrop .h-head::after{
    content:"";position:absolute;top:-4px;width:12px;height:36px;
    background:linear-gradient(180deg,#81d4fa,#01579b);
    border-radius:3px;
  }
  #hammerDrop .h-head::before{left:-8px}
  #hammerDrop .h-head::after{right:-8px}
  #hammerDrop .h-face{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:36px;height:18px;
    background:linear-gradient(180deg,#b3e5fc,#0288d1);
    border-radius:3px;
  }
  #hammerDrop .h-handle{
    position:absolute;top:34px;left:50%;transform:translateX(-50%);
    width:10px;height:72px;
    background:linear-gradient(90deg,#01579b,#4fc3f7 40%,#0277bd 60%,#01579b);
    border-radius:4px;
    box-shadow:0 0 8px rgba(41,182,246,0.5);
  }
  #hammerDrop .h-grip{
    position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
    width:14px;height:22px;
    background:linear-gradient(180deg,#0277bd,#0d47a1);
    border-radius:3px;
    border:1px solid #81d4fa;
  }
  @keyframes hammerSwing{
    /* เริ่มจากขวาจอ เหวี่ยงโค้งลงมาทุบ */
    0%{
      right: -40px; left: auto;
      top: 18%;
      opacity: 0;
      transform: rotate(55deg) scale(0.75);
    }
    12%{ opacity: 1; }
    45%{
      right: 28%;
      top: 42%;
      transform: rotate(15deg) scale(1.1);
    }
    68%{
      right: 42%;
      top: auto;
      bottom: 95px;
      transform: rotate(-20deg) scale(1.2);
    }
    82%{
      right: 44%;
      bottom: 88px;
      transform: rotate(-5deg) scale(1.05);
    }
    100%{
      right: 44%;
      bottom: 90px;
      opacity: 0;
      transform: rotate(0deg) scale(0.95);
    }
  }
  #hammerImpact{
    display:none;position:fixed;left:50%;z-index:99;pointer-events:none;
    width:80px;height:24px;margin-left:-40px;
    background:radial-gradient(ellipse,rgba(79,195,247,0.95) 0%,rgba(2,136,209,0.5) 50%,transparent 70%);
    border-radius:50%;
    box-shadow:0 0 30px 12px rgba(41,182,246,0.7);
    animation:hammerImpactFx .4s ease-out forwards;
  }
  @keyframes hammerImpactFx{
    0%{opacity:0;width:20px;height:8px;margin-left:-10px}
    40%{opacity:1;width:100px;height:30px;margin-left:-50px}
    100%{opacity:0;width:140px;height:18px;margin-left:-70px}
  }
  #timingTrack{position:relative;height:36px;width:100%;max-width:340px;margin:8px auto 0;background:linear-gradient(90deg,#1a0000,#4a0000 40%,#2b0000);border-radius:12px;border:2px solid #c62828;overflow:hidden}
  #timingZone{position:absolute;top:3px;height:calc(100% - 6px);width:22%;background:rgba(255,23,68,0.35);border:2px solid #ff5252;border-radius:8px;box-sizing:border-box}
  #timingMarker{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;background:#ff1744;border-radius:50%;box-shadow:0 0 10px #ff1744;font-size:14px;line-height:26px;text-align:center}
  #timingHint{font-size:0.75rem;color:#ef9a9a;margin-top:3px}
  #castUI{display:none;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:92%;max-width:320px;z-index:9;text-align:center;background:rgba(15,0,0,0.9);padding:10px;border-radius:12px;border:1px solid #ff1744}
  #castTitle{font-size:0.95rem;font-weight:bold;color:#ff8a80;margin-bottom:6px}
  #castTrack{position:relative;height:28px;background:#1a0000;border-radius:10px;border:2px solid #c62828;overflow:hidden}
  #castZone{position:absolute;top:0;height:100%;width:18%;left:41%;background:rgba(255,23,68,0.4);border-left:2px solid #ff5252;border-right:2px solid #ff5252}
  #castMarker{position:absolute;top:0;width:6px;height:100%;background:#ffeb3b;box-shadow:0 0 8px #ff0;border-radius:2px}
  #castHint{font-size:0.72rem;color:#ef9a9a;margin-top:5px}
  #reelBtn{display:none;margin-top:8px;width:100%;padding:12px;font-size:1.15rem;font-weight:bold;background:linear-gradient(180deg,#ff1744,#9a0007);color:#fff;border:1px solid #ff8a80;border-radius:11px;box-shadow:0 0 14px rgba(255,23,68,0.4)}
  #reelBtn:active{background:#c62828}
  #megaTimer{
    position:fixed; top:8px; right:8px; z-index:55;
    background:rgba(20,0,0,0.88); color:#ff8a80; font-size:0.72rem;
    padding:6px 8px; border-radius:8px; text-align:center; line-height:1.25;
    font-weight:bold; border:1px solid #c62828; min-width:72px;
  }
  #megaTimer.active{ color:#ff1744; border-color:#ff1744; box-shadow:0 0 12px rgba(255,23,68,0.5); }
  #loginScreen{
    position:fixed; inset:0; z-index:100;
    background:radial-gradient(circle at 50% 30%, #3a0000 0%, #0a0a0a 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px;
  }
  #loginScreen h1{ font-size:1.7rem; margin-bottom:6px; color:#ff1744; text-shadow:0 0 16px rgba(255,23,68,0.6); }

// ===== ระบบเสียง (Web Audio API) =====
let audioCtx = null;
let soundEnabled = true;
let ambientNodes = []; // เก็บ node บรรยากาศที่กำลังเล่น

function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playTone(freq, dur, type, vol, slide){
  if(!soundEnabled) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  if(slide) osc.frequency.linearRampToValueAtTime(slide, ctx.currentTime + dur);
  gain.gain.setValueAtTime(vol || 0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + dur);
}
function playNoise(dur, vol){
  if(!soundEnabled) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const bufferSize = ctx.sampleRate * dur;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/bufferSize, 2);
  const src = ctx.createBufferSource();
  const gain = ctx.createGain();
  src.buffer = buffer;
  gain.gain.setValueAtTime(vol || 0.1, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  src.connect(gain); gain.connect(ctx.destination);
  src.start();
}

// สร้าง noise loop สำหรับบรรยากาศ
function createNoiseLoop(vol, filterFreq, filterType){
  const ctx = ensureAudio(); if(!ctx) return null;
  const bufferSize = ctx.sampleRate * 2;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = filterType || "lowpass";
  filter.frequency.value = filterFreq || 800;
  const gain = ctx.createGain();
  gain.gain.value = vol || 0.03;
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start();
  return {src, gain, filter};
}
function createToneLoop(freq, type, vol){
  const ctx = ensureAudio(); if(!ctx) return null;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.value = vol || 0.02;
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start();
  return {src: osc, gain};
}
function stopAmbient(){
  ambientNodes.forEach(n=>{
    try{
      if(n.gain) n.gain.gain.linearRampToValueAtTime(0.001, (audioCtx||ensureAudio()).currentTime + 0.3);
      setTimeout(()=>{ try{ n.src.stop(); }catch(e){} }, 400);
    }catch(e){}
  });
  ambientNodes = [];
}
function startAmbient(loc, weather){
  stopAmbient();
  if(!soundEnabled) return;
  const ctx = ensureAudio(); if(!ctx) return;

  // เสียงพื้นฐานตามสถานที่
  if(loc===0){ // ชายหาด - คลื่นทะเล
    ambientNodes.push(createNoiseLoop(0.035, 600, "lowpass"));
    ambientNodes.push(createToneLoop(180, "sine", 0.015));
  } else if(loc===1){ // เกาะลึกลับ - ลมเบา + นก
    ambientNodes.push(createNoiseLoop(0.025, 1200, "bandpass"));
    ambientNodes.push(createToneLoop(320, "triangle", 0.012));
  } else if(loc===2){ // ทะเลลึก - เสียงทุ้มใต้น้ำ
    ambientNodes.push(createNoiseLoop(0.04, 300, "lowpass"));
    ambientNodes.push(createToneLoop(80, "sine", 0.025));
  } else if(loc===3){ // เกาะลับ - เสียงลึกลับ
    ambientNodes.push(createNoiseLoop(0.02, 900, "bandpass"));
    ambientNodes.push(createToneLoop(440, "sine", 0.012));
    ambientNodes.push(createToneLoop(554, "sine", 0.008));
  } else if(loc===4){ // ซากใต้น้ำ - ลาวา / เดือด
    ambientNodes.push(createNoiseLoop(0.04, 400, "lowpass"));
    ambientNodes.push(createToneLoop(100, "sawtooth", 0.012));
  } else if(loc===5){ // บึงลึกลับ - แมลง / น้ำนิ่ง
    ambientNodes.push(createNoiseLoop(0.02, 2000, "highpass"));
    ambientNodes.push(createToneLoop(250, "sine", 0.01));
  } else if(loc===6){ // ทะเลน้ำแข็ง - ลมหนาว
    ambientNodes.push(createNoiseLoop(0.03, 1500, "highpass"));
    ambientNodes.push(createToneLoop(500, "sine", 0.01));
  } else if(loc===7){ // มิติมืด - เสียงต่ำน่าขนลุก
    ambientNodes.push(createNoiseLoop(0.035, 200, "lowpass"));
    ambientNodes.push(createToneLoop(55, "sine", 0.03));
    ambientNodes.push(createToneLoop(70, "triangle", 0.01));
  } else if(loc===8){ // เกาะโบราณ
    ambientNodes.push(createNoiseLoop(0.025, 500, "lowpass"));
    ambientNodes.push(createToneLoop(110, "triangle", 0.015));
    ambientNodes.push(createToneLoop(165, "sine", 0.01));
  } else if(loc===9){ // ถ้ำน้ำวน
    ambientNodes.push(createNoiseLoop(0.04, 400, "lowpass"));
    ambientNodes.push(createToneLoop(90, "sawtooth", 0.02));
    ambientNodes.push(createToneLoop(140, "sine", 0.015));
  } else if(loc===10){ // แท่นเสริมพลัง
    ambientNodes.push(createToneLoop(220, "sine", 0.02));
    ambientNodes.push(createToneLoop(330, "triangle", 0.012));
    ambientNodes.push(createNoiseLoop(0.02, 900, "bandpass"));
  } else if(loc===11){ // เกาะลาวา
    ambientNodes.push(createNoiseLoop(0.035, 300, "lowpass"));
    ambientNodes.push(createToneLoop(70, "sawtooth", 0.018));
    ambientNodes.push(createToneLoop(110, "square", 0.01));
  } else if(loc===12){ // เกาะสายรุ้ง
    ambientNodes.push(createToneLoop(440, "sine", 0.012));
    ambientNodes.push(createToneLoop(554, "sine", 0.01));
    ambientNodes.push(createToneLoop(659, "triangle", 0.008));
  } else if(loc===13){ // ออบซิเดียน
    ambientNodes.push(createNoiseLoop(0.03, 200, "lowpass"));
    ambientNodes.push(createToneLoop(55, "sawtooth", 0.02));
    ambientNodes.push(createToneLoop(82, "square", 0.01));
  } else if(loc===14){ // ทะเลเมฆ
    ambientNodes.push(createNoiseLoop(0.02, 800, "lowpass"));
    ambientNodes.push(createToneLoop(180, "sine", 0.015));
    ambientNodes.push(createToneLoop(240, "triangle", 0.01));
  } else {
    ambientNodes.push(createNoiseLoop(0.025, 700, "lowpass"));
  }

  // สภาพอากาศทับซ้อน
  if(weather === 1){ // ฝน
    ambientNodes.push(createNoiseLoop(0.05, 3000, "highpass"));
  }
  if(weather === 2){ // ลมแรง
    ambientNodes.push(createNoiseLoop(0.04, 800, "bandpass"));
    ambientNodes.push(createToneLoop(150, "sine", 0.015));
  }
}

    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2800; bp.Q.value=4;
    const g = ctx.createGain();

    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.08);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);

function tn(name){ return (currentLang==="en" && NAME_EN[name]) ? NAME_EN[name] : name; }

function applyUILanguage(){
  const L = LANG[currentLang]||LANG.th;
  document.title = L.gameTitle;
  document.querySelectorAll("h1").forEach(h=>{ h.textContent = "🎣 "+L.gameTitle; });
  const sub = document.querySelector("#loginScreen .sub");
  if(sub) sub.textContent = L.loginSub;
  const labels = document.querySelectorAll("#loginScreen label");
  if(labels[0]) labels[0].textContent = L.username;
  if(labels[1]) labels[1].textContent = L.password;
  const iu=document.getElementById("inputUser"), ip=document.getElementById("inputPass");
  if(iu) iu.placeholder = L.userPlaceholder;
  if(ip) ip.placeholder = L.passPlaceholder;
  const bl=document.getElementById("btnLogin"), br=document.getElementById("btnRegister");
  if(bl) bl.textContent = L.login;
  if(br) br.textContent = L.register;
  const map = {locationBtn:L.location,castBtn:L.cast,shopBtn:L.shop,questBtn:L.quest,craftBtn:L.craft,bookBtn:L.book,statBtn:L.stats,settingsBtn:L.settings,closePanel:L.close,invBtn:msg("กระเป๋า","Bag")};
  for(const id in map){ const el=document.getElementById(id); if(el) el.textContent=map[id]; }
  const rb=document.getElementById("reelBtn"); if(rb) rb.textContent=L.pull;
  const ml=document.getElementById("moneyLabel"); if(ml) ml.textContent = currentLang==="en" ? "Coins" : "เงิน";
}

function makeFishKey(name, weight){ return name + "@" + weight; }
function parseFishKey(key){
  let aurora = false;
  let k = key;
  if(k.endsWith("@aurora")){
    aurora = true;
    k = k.slice(0, -7);
  }
  const i = k.lastIndexOf("@");
  if(i < 0) return {name:k, weight:"?", aurora};
  return {name:k.slice(0,i), weight:k.slice(i+1), aurora};
}

function getToday(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function initDailyQuests(){
  const today=getToday(),saved=localStorage.getItem("fisch_v4");
  if(saved){const data=JSON.parse(saved);if(data.date===today){dailyQuests=data.quests;questProgress=data.progress||{};claimedQuests=data.claimed||{};return}}
  dailyQuests=[...questTemplates].sort(()=>Math.random()-0.5).slice(0,5);
  questProgress={};claimedQuests={};dailyQuests.forEach(q=>questProgress[q.id]=0);saveDaily();
}
function saveDaily(){localStorage.setItem("fisch_v4",JSON.stringify({date:getToday(),quests:dailyQuests,progress:questProgress,claimed:claimedQuests}))}
function addQuestProgress(type,amount=1){
  dailyQuests.forEach(q=>{if(q.type===type&&!claimedQuests[q.id])questProgress[q.id]=Math.min((questProgress[q.id]||0)+amount,q.target)});
  addStoryProgress(type, amount);
  saveDaily();
}
function claimQuest(id){
  const q=dailyQuests.find(x=>x.id===id);
  if(!q||claimedQuests[id]||(questProgress[id]||0)<q.target)return;

  showMessage(msg(`รับรางวัล!\n+${q.reward} เงิน`,`Reward claimed!\n+${q.reward} coins`),1800);

}

let activeStory={}; // id -> progress
let acceptedStory={}; // id -> true
let completedStory={}; // id -> true

function acceptStory(id){
  if(acceptedStory[id] || completedStory[id]) return;
  acceptedStory[id]=true;
  activeStory[id]=0;
  // เซฟทันที กันค่าเลเวล/กระเป๋าหายหลังรับเควส
  try{ saveGame(); }catch(e){}
  updateUI();
  showMessage(msg("รับภารกิจแล้ว!\n","Quest accepted!\n")+tn((storyQuests.find(q=>q.id===id)||{}).name||id), 1800);
  openQuests();
}
function addStoryProgress(type, amount=1){
  storyQuests.forEach(q=>{
    if(!acceptedStory[q.id] || completedStory[q.id]) return;
    if(q.type!==type) return;
    activeStory[q.id] = Math.min((activeStory[q.id]||0)+amount, q.target);
  });
}
function claimStory(id){
  const q = storyQuests.find(x=>x.id===id);
  if(!q || completedStory[id]) return;
  if((activeStory[id]||0) < q.target) return;
  completedStory[id]=true;
  money += q.rewardMoney;
  let itemMsg = "";
  if(q.rewardItem){
    if(q.rewardItem==="ไม้" || q.rewardItem==="เหล็ก" || q.rewardItem==="คริสตัล" || q.rewardItem==="เกล็ดมังกร"){
      materials[q.rewardItem] = (materials[q.rewardItem]||0) + q.rewardQty;
      itemMsg = `\n+${q.rewardItem} x${q.rewardQty}`;
    } else {
      const bait = baits.find(b=>b.name===q.rewardItem);
      if(bait){ bait.owned += q.rewardQty; itemMsg = `\n+${q.rewardItem} x${q.rewardQty}`; }
    }
  }
  try{ saveGame(); }catch(e){}
  updateUI();
  SFX.levelup();
  showMessage(msg(`🎉 ภารกิจสำเร็จ!\n${tn(q.name)}\n+${q.rewardMoney} เงิน${itemMsg}`,`🎉 Quest complete!\n${tn(q.name)}\n+${q.rewardMoney} coins${itemMsg}`), 2800);
  openQuests();
}

function addExp(amount){
  // บัฟน้ำยา XP x100
  if(xpBoostUntil && Date.now() < xpBoostUntil){
    amount = amount * 100;
  }
  if(level >= 1000){
    // เลเวลสูงสุดแล้ว ยังได้รับเงินเล็กน้อยแทน EXP
    money += Math.floor(amount / 5);
    updateUI();
    return;
  }
  exp += amount;
  let leveled = false;
  while(exp >= expToNext && level < 1000){
    exp -= expToNext;
    level++;
    expToNext = Math.floor(50 + level * 35);
    money += 30 + level * 15;
    leveled = true;
    // ปลดล็อกเบ็ดตามเลเวล
    if(level === 500 && rods[29] && !rods[29].owned){
      rods[29].owned = true;
      SFX.levelup();
      showMessage(msg(`🎉 ถึง Lv.500!\nปลดล็อกเบ็ดเลเวล 500!`,`🎉 Reached Lv.500!\nUnlocked Level 500 Rod!`), 3000);
    }
    if(level === 750 && rods[30] && !rods[30].owned){
      rods[30].owned = true;
      SFX.levelup();
      showMessage(msg(`🎉 ถึง Lv.750!\nปลดล็อกเบ็ดเลเวล 750!`,`🎉 Reached Lv.750!\nUnlocked Level 750 Rod!`), 3000);
    }
    if(level >= 1000){
      exp = 0;
      expToNext = 999999;
      if(rods[31] && !rods[31].owned) rods[31].owned = true;
      SFX.levelup();
      showMessage(msg(`🎉 ถึงเลเวลสูงสุดแล้ว!\nLv.1000\nปลดล็อกเบ็ดราชันย์เลเวล 1000!`,`🎉 Max level reached!\nLv.1000\nUnlocked Level 1000 Royal Rod!`), 3500);
      break;
    }
  }
  updateUI();
  if(leveled && level < 1000 && level !== 500 && level !== 750){
    SFX.levelup();
    showMessage(msg(`เลเวลอัพ! Lv.${level}\nได้เงินโบนัส`,`Level up! Lv.${level}\nBonus coins`), 2200);
  }
  checkAchievements();
}
function checkAchievements(){
  achievementList.forEach(a=>{
    if(!achievements[a.id]&&a.check()){achievements[a.id]=true;money+=a.reward;showMessage(msg(`🏆 ความสำเร็จ!\n${a.name}\n+${a.reward} เงิน`,`🏆 Achievement!\n${a.name}\n+${a.reward} coins`),2500)}
  });
}

function changeWeather(){
  // โอกาสออโรร่า 2% · อื่นๆ แบ่งเท่าๆ
  const roll = Math.random();
  if(roll < 0.02){
    currentWeather = 3; // ออโรร่า
  } else {
    currentWeather = Math.floor(Math.random()*3); // 0-2
  }
  isDay = Math.random()>0.4;
  // ออโรร่าอยู่ 5 นาที · อากาศอื่น 10 นาที
  const durMs = (currentWeather===3) ? 5*60*1000 : 10*60*1000;
  weatherEndAt = Date.now() + durMs;
  updateUI();
  if(currentUser) startAmbient(currentLoc, currentWeather);
  if(currentWeather===3){
    showMessage(msg("🌌 ออโรร่า!\nปลาที่ตกได้ราคา x2 (5 นาที)","🌌 Aurora!\nCaught fish sell x2 (5 min)"), 2500);
  }
}
function ensureWeatherTimer(){
  if(weatherTimerIv) return;
  weatherTimerIv = setInterval(()=>{
    if(!currentUser) return;
    if(!weatherEndAt){
      changeWeather();
      return;
    }
    if(Date.now() >= weatherEndAt){
      changeWeather();
    } else {
      // อัปเดตนาฬิกาอากาศบน UI
      updateWeatherHud();
    }
  }, 1000);
}
function updateWeatherHud(){
  const el = document.getElementById('weatherInfo');
  if(!el) return;
  const w = weathers[currentWeather];
  let left = "";
  if(weatherEndAt){
    const sec = Math.max(0, Math.ceil((weatherEndAt - Date.now())/1000));
    const m = Math.floor(sec/60), s = sec%60;
    left = ` | ⏱ ${m}:${String(s).padStart(2,"0")}`;
  }
  let boost = "";
  if(xpBoostUntil && Date.now() < xpBoostUntil){
    const sec = Math.max(0, Math.ceil((xpBoostUntil - Date.now())/1000));
    boost = ` | 🧪 XP x100 ${sec}s`;
  }
  el.textContent = `${w.icon} ${tn(w.name)} | ${isDay?t("day"):t("night")} | ${tn(baits[currentBait].name)}${left}${boost}`;
}

// ===== ISLAND SCENES + LIGHTING (added) =====
function _rr(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function _glow(x,y,r,rgb,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,"rgba("+rgb+","+a+")");
  g.addColorStop(1,"rgba("+rgb+",0)");
  ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function _beam(x1,y1,x2,y2,w1,w2,rgb,a){
  const g=ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,"rgba("+rgb+","+a+")");
  g.addColorStop(1,"rgba("+rgb+",0)");
  ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x1-w1/2,y1); ctx.lineTo(x1+w1/2,y1);
  ctx.lineTo(x2+w2/2,y2); ctx.lineTo(x2-w2/2,y2);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function _rimCol(a){ return isDay ? "rgba(255,240,190,"+a+")" : "rgba(170,190,255,"+a+")"; }
function _reflect(x,y,w,col){
  const tm=Date.now()/900;
  ctx.save(); ctx.globalAlpha=0.2; ctx.fillStyle=col;
  for(let i=0;i<5;i++){
    const ww=w*(0.95-i*0.15);
    ctx.fillRect(x-ww/2+Math.sin(tm+i)*4, y+4+i*5, ww, 2);
  }
  ctx.restore();
}
// island silhouette: shaded left, rim light on right (light comes from upper right)
function _mound(x,baseY,w,h,top,bot){
  const g=ctx.createLinearGradient(0,baseY-h,0,baseY);
  g.addColorStop(0,top); g.addColorStop(1,bot);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x-w/2,baseY);
  ctx.quadraticCurveTo(x-w*0.28,baseY-h*0.95,x,baseY-h);
  ctx.quadraticCurveTo(x+w*0.28,baseY-h*0.95,x+w/2,baseY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle="rgba(0,0,0,0.28)";
  ctx.beginPath();
  ctx.moveTo(x-w/2,baseY);
  ctx.quadraticCurveTo(x-w*0.28,baseY-h*0.95,x,baseY-h);
  ctx.lineTo(x-w*0.04,baseY);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=_rimCol(0.5); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x,baseY-h);
  ctx.quadraticCurveTo(x+w*0.28,baseY-h*0.95,x+w/2,baseY); ctx.stroke();
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.beginPath(); ctx.ellipse(x-w*0.12,baseY+2,w*0.55,3.5,0,0,Math.PI*2); ctx.fill();
}
function _palm(x,y,s,sw){
  const tm=Date.now()/900;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,0.22)";
  ctx.beginPath(); ctx.ellipse(x-14*s,y+2,20*s,3.5*s,0,0,Math.PI*2); ctx.fill();
  const tx=x+8*s+sw, ty=y-42*s;
  ctx.lineCap="round";
  ctx.strokeStyle="#5d4037"; ctx.lineWidth=5*s;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+3*s,y-24*s,tx,ty); ctx.stroke();
  ctx.strokeStyle=isDay?"rgba(255,224,178,0.4)":"rgba(160,180,255,0.3)"; ctx.lineWidth=1.6*s;
  ctx.beginPath(); ctx.moveTo(x+2*s,y); ctx.quadraticCurveTo(x+5*s,y-24*s,tx+1.5*s,ty); ctx.stroke();
  for(let i=0;i<7;i++){
    const a=-Math.PI/2+(i-3)*0.62+Math.sin(tm+i)*0.05;
    const len=(24+(i%2)*5)*s;
    const ex=tx+Math.cos(a)*len, ey=ty+Math.sin(a)*len*0.7+10*s*Math.abs(Math.cos(a));
    const mx=tx+Math.cos(a)*len*0.5, my=ty+Math.sin(a)*len*0.5-6*s;
    const lg=ctx.createLinearGradient(tx,ty,ex,ey);
    lg.addColorStop(0,isDay?"#66bb6a":"#2e5e4e");
    lg.addColorStop(1,isDay?"#1b5e20":"#10301f");
    ctx.fillStyle=lg;
    ctx.beginPath(); ctx.moveTo(tx,ty);
    ctx.quadraticCurveTo(mx,my-4*s,ex,ey);
    ctx.quadraticCurveTo(mx,my+5*s,tx,ty);
    ctx.fill();
  }
  ctx.fillStyle="#4e342e";
  ctx.beginPath(); ctx.arc(tx-3*s,ty+3*s,2.4*s,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(tx+3*s,ty+4*s,2.4*s,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function _crystal(x,y,w,h,hi,lo,rgb){

  ctx.moveTo(x-w/2,y); ctx.lineTo(x-w*0.35,y-h*0.7); ctx.lineTo(x,y-h);

  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.moveTo(x-w/2,y); ctx.lineTo(x-w*0.35,y-h*0.7); ctx.lineTo(x,y-h); ctx.lineTo(x-w*0.05,y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.7)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,y-h); ctx.lineTo(x+w*0.35,y-h*0.7); ctx.stroke();
}
function _pillar(x,y,w,h){

  ctx.beginPath(); ctx.moveTo(x+w/2-1,y-h); ctx.lineTo(x+w/2-1,y); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(x-w*0.1,y-h*0.6); ctx.lineTo(x+w*0.15,y-h*0.45); ctx.lineTo(x-w*0.05,y-h*0.3); ctx.stroke();
}
function _jelly(x,y,s,rgb,tm){
  _glow(x,y,26*s,rgb,0.35);

function _mangrove(x,y,s){
  const tm=Date.now()/1000;
  ctx.fillStyle="rgba(0,0,0,0.22)";
  ctx.beginPath(); ctx.ellipse(x-8*s,y+6,40*s,6*s,0,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle="#4e342e"; ctx.lineWidth=7*s;
  ctx.beginPath(); ctx.moveTo(x,y-4*s); ctx.lineTo(x,y-34*s); ctx.stroke();

function _berg(x,y,w,h){

function _temple(x,y,s){

function _cloud(x,y,s,a){

function _particles(kind,count,rgb){
  const W=canvas.width, H=canvas.height, tm=Date.now()/1000;
  ctx.save();
  for(let i=0;i<count;i++){
    if(kind==="firefly"){
      const x=((_rr(i)*W+Math.sin(tm*0.6+i)*20)+W)%W;
      const y=100+_rr(i+9)*200+Math.cos(tm*0.5+i*2)*15;
      const a=0.3+0.7*Math.abs(Math.sin(tm*2+i));

      ctx.fillStyle="rgba(255,255,230,"+a+")"; ctx.beginPath(); ctx.arc(x,y,1.2,0,Math.PI*2); ctx.fill();
    } else if(kind==="bubble"){
      const y=H-((tm*18*(0.5+_rr(i))+_rr(i*3)*H)%(H-90));
      const x=_rr(i)*W+Math.sin(tm+i)*6, r=1.5+_rr(i*7)*3;

      ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.3,r*0.25,0,Math.PI*2); ctx.fill();
    } else if(kind==="snow"){
      const y=(tm*20*(0.6+_rr(i))+_rr(i*5)*H)%H;
      const x=_rr(i)*W+Math.sin(tm*0.7+i)*10, r=1+_rr(i*9)*1.8;

    } else if(kind==="ember"){
      const k=(tm*30*(0.4+_rr(i))+_rr(i*3)*H)%H;
      const y=H-k, x=_rr(i)*W+Math.sin(tm*1.3+i)*10, a=Math.max(0,1-k/H);

    } else if(kind==="mote"){
      const y=H-((tm*8*(0.5+_rr(i))+_rr(i*3)*H)%H);
      const x=_rr(i)*W+Math.sin(tm*0.4+i)*14;
      ctx.fillStyle="rgba("+rgb+","+(0.15+0.3*Math.abs(Math.sin(tm+i)))+")";
      ctx.beginPath(); ctx.arc(x,y,1.3,0,Math.PI*2); ctx.fill();
    } else if(kind==="sparkle"){
      const x=_rr(i*2.3)*W, y=95+_rr(i*5.1)*230, a=Math.abs(Math.sin(tm*2+i*1.9));
      ctx.strokeStyle="rgba("+rgb+","+(a*0.9)+")"; ctx.lineWidth=1;

      ctx.beginPath(); ctx.moveTo(x-s,y); ctx.lineTo(x+s,y); ctx.moveTo(x,y-s); ctx.lineTo(x,y+s); ctx.stroke();
    }
  }
  ctx.restore();
}

    case 5: _particles("firefly",14,"190,255,120"); break;

    case 7: _particles("mote",22,"200,130,255"); break;
    case 8: _particles("mote",18,"255,220,150"); break;
    case 9: _particles("bubble",10,""); _particles("mote",10,"150,250,255"); break;
    case 10: _particles("sparkle",16,"220,190,255"); break;
    case 11: _particles("ember",20,"255,100,30"); break;
    case 12: _particles("sparkle",22,"255,240,255"); break;
    case 13: _particles("mote",16,"190,120,255"); break;
    case 14: _particles("sparkle",10,"255,255,255"); break;
  }
}

function draw(){
  const loc=locations[currentLoc];
  const grad=ctx.createLinearGradient(0,0,0,canvas.height);

  // สีต่างกันตามสถานที่ + กลางวัน/กลางคืน
  if(currentLoc===0){ // ชายหาด
    if(isDay){ grad.addColorStop(0,"#81d4fa"); grad.addColorStop(0.5,"#4fc3f7"); grad.addColorStop(1,"#0288d1"); }
    else { grad.addColorStop(0,"#1a237e"); grad.addColorStop(1,"#0d47a1"); }
  } else if(currentLoc===1){ // เกาะลึกลับ
    if(isDay){ grad.addColorStop(0,"#80cbc4"); grad.addColorStop(0.4,"#26a69a"); grad.addColorStop(1,"#00695c"); }
    else { grad.addColorStop(0,"#004d40"); grad.addColorStop(1,"#00251a"); }
  } else if(currentLoc===2){ // ทะเลลึก
    if(isDay){ grad.addColorStop(0,"#5c6bc0"); grad.addColorStop(0.5,"#303f9f"); grad.addColorStop(1,"#1a237e"); }
    else { grad.addColorStop(0,"#0d1b2a"); grad.addColorStop(1,"#000814"); }
  } else if(currentLoc===3){ // เกาะลับ
    if(isDay){ grad.addColorStop(0,"#e1bee7"); grad.addColorStop(0.4,"#ce93d8"); grad.addColorStop(1,"#8e24aa"); }
    else { grad.addColorStop(0,"#4a148c"); grad.addColorStop(1,"#1a0033"); }
  } else if(currentLoc===4){ // ซากใต้น้ำ
    if(isDay){ grad.addColorStop(0,"#ffab91"); grad.addColorStop(0.4,"#ff7043"); grad.addColorStop(1,"#d84315"); }
    else { grad.addColorStop(0,"#bf360c"); grad.addColorStop(1,"#3e2723"); }
  } else if(currentLoc===5){ // บึงลึกลับ
    if(isDay){ grad.addColorStop(0,"#c5e1a5"); grad.addColorStop(0.4,"#9ccc65"); grad.addColorStop(1,"#558b2f"); }
    else { grad.addColorStop(0,"#33691e"); grad.addColorStop(1,"#1b5e20"); }
  } else if(currentLoc===6){ // ทะเลน้ำแข็ง
    if(isDay){ grad.addColorStop(0,"#e1f5fe"); grad.addColorStop(0.4,"#81d4fa"); grad.addColorStop(1,"#0288d1"); }
    else { grad.addColorStop(0,"#01579b"); grad.addColorStop(1,"#002f6c"); }
  } else if(currentLoc===7){ // มิติมืด
    if(isDay){ grad.addColorStop(0,"#7b1fa2"); grad.addColorStop(0.5,"#4a148c"); grad.addColorStop(1,"#1a0033"); }
    else { grad.addColorStop(0,"#12001a"); grad.addColorStop(1,"#000000"); }
  } else if(currentLoc===8){ // เกาะโบราณ
    if(isDay){
      grad.addColorStop(0,"#fff8e1");
      grad.addColorStop(0.25,"#d7ccc8");
      grad.addColorStop(0.55,"#a1887f");
      grad.addColorStop(1,"#4e342e");
    } else {
      grad.addColorStop(0,"#5d4037");
      grad.addColorStop(0.5,"#3e2723");
      grad.addColorStop(1,"#1a0a00");
    }
  } else if(currentLoc===9){ // ถ้ำน้ำวน
    if(isDay){ grad.addColorStop(0,"#e0f7fa"); grad.addColorStop(0.25,"#4dd0e1"); grad.addColorStop(0.55,"#00acc1"); grad.addColorStop(1,"#004d40"); }
    else { grad.addColorStop(0,"#00695c"); grad.addColorStop(0.5,"#004d40"); grad.addColorStop(1,"#001a14"); }
  } else if(currentLoc===10){ // แท่นเสริมพลัง
    if(isDay){
      grad.addColorStop(0,"#f3e5f5");
      grad.addColorStop(0.25,"#ce93d8");
      grad.addColorStop(0.55,"#7e57c2");
      grad.addColorStop(1,"#1a0033");
    } else {
      grad.addColorStop(0,"#6a1b9a");
      grad.addColorStop(0.4,"#4a148c");
      grad.addColorStop(1,"#0d001a");
    }
  } else if(currentLoc===11){ // เกาะลาวา
    if(isDay){
      grad.addColorStop(0,"#ffe0b2");
      grad.addColorStop(0.3,"#ff8a65");
      grad.addColorStop(0.65,"#e64a19");
      grad.addColorStop(1,"#bf360c");
    } else {
      grad.addColorStop(0,"#bf360c");
      grad.addColorStop(0.5,"#6d1b00");
      grad.addColorStop(1,"#1a0500");
    }
  } else if(currentLoc===12){ // เกาะสายรุ้ง
    if(isDay){
      grad.addColorStop(0,"#fce4ec");
      grad.addColorStop(0.25,"#f8bbd0");
      grad.addColorStop(0.5,"#ce93d8");
      grad.addColorStop(0.75,"#90caf9");
      grad.addColorStop(1,"#80cbc4");
    } else {
      grad.addColorStop(0,"#4a148c");
      grad.addColorStop(0.5,"#1a237e");
      grad.addColorStop(1,"#004d40");
    }
  } else if(currentLoc===13){ // ออบซิเดียน
    if(isDay){
      grad.addColorStop(0,"#78909c");
      grad.addColorStop(0.4,"#455a64");
      grad.addColorStop(1,"#212121");
    } else {
      grad.addColorStop(0,"#263238");
      grad.addColorStop(1,"#000000");
    }
  } else if(currentLoc===14){ // ทะเลเมฆ
    if(isDay){
      grad.addColorStop(0,"#ffffff");
      grad.addColorStop(0.35,"#e3f2fd");
      grad.addColorStop(0.7,"#90caf9");
      grad.addColorStop(1,"#64b5f6");
    } else {
      grad.addColorStop(0,"#37474f");
      grad.addColorStop(0.5,"#1a237e");
      grad.addColorStop(1,"#0d47a1");
    }
  } else {
    if(isDay){ grad.addColorStop(0,"#81d4fa"); grad.addColorStop(1,"#0288d1"); }
    else { grad.addColorStop(0,"#1a237e"); grad.addColorStop(1,"#0d47a1"); }
  }
  ctx.fillStyle=grad;ctx.fillRect(0,0,canvas.width,canvas.height);

  // ดวงอาทิตย์ / ดวงจันทร์ จัดเต็ม
  if(isDay){
    // ท้องฟ้าเรืองจากดวงอาทิตย์
    const skyGlow = ctx.createRadialGradient(300, 30, 5, 300, 50, 220);
    skyGlow.addColorStop(0, "rgba(255,250,200,0.45)");
    skyGlow.addColorStop(0.3, "rgba(255,220,120,0.2)");
    skyGlow.addColorStop(0.65, "rgba(255,180,80,0.06)");
    skyGlow.addColorStop(1, "rgba(255,150,50,0)");
    ctx.fillStyle = skyGlow;
    ctx.fillRect(0, 0, canvas.width, 120);

    // God rays
    ctx.save();
    ctx.translate(300, 42);
    for(let i=0;i<12;i++){
      ctx.rotate(Math.PI/6);
      const rg = ctx.createLinearGradient(0, 0, 0, 160);
      rg.addColorStop(0, "rgba(255,245,180,0.22)");
      rg.addColorStop(0.5, "rgba(255,230,140,0.08)");
      rg.addColorStop(1, "rgba(255,200,100,0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-14, 160);
      ctx.lineTo(14, 160);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // แกนดวงอาทิตย์
    const core = ctx.createRadialGradient(300, 42, 2, 300, 42, 32);
    core.addColorStop(0, "#ffffff");
    core.addColorStop(0.35, "#fff59d");
    core.addColorStop(0.7, "#ffeb3b");
    core.addColorStop(1, "rgba(255,160,0,0.15)");
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(300, 42, 32, 0, Math.PI*2); ctx.fill();
    // ขอบแสง
    ctx.strokeStyle = "rgba(255,255,200,0.35)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(300, 42, 28, 0, Math.PI*2); ctx.stroke();
  } else {
    // แสงจันทร์กระจาย
    const moonG = ctx.createRadialGradient(300, 42, 3, 300, 42, 100);
    moonG.addColorStop(0, "rgba(220,230,255,0.4)");
    moonG.addColorStop(0.4, "rgba(160,180,255,0.12)");
    moonG.addColorStop(1, "rgba(80,100,180,0)");
    ctx.fillStyle = moonG;
    ctx.fillRect(0, 0, canvas.width, 130);

    // ลำแสงจันทร์จาง
    ctx.save();
    ctx.translate(300, 42);
    for(let i=0;i<6;i++){
      ctx.rotate(Math.PI/3);
      ctx.fillStyle = "rgba(180,200,255,0.06)";
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(-10, 100); ctx.lineTo(10, 100);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // ดวงจันทร์
    const mc = ctx.createRadialGradient(296, 38, 2, 300, 42, 18);
    mc.addColorStop(0, "#ffffff");
    mc.addColorStop(0.6, "#e8eaf6");
    mc.addColorStop(1, "#90a4ae");
    ctx.fillStyle = mc;
    ctx.beginPath(); ctx.arc(300, 42, 17, 0, Math.PI*2); ctx.fill();
    // หลุม
    ctx.fillStyle = "rgba(120,140,160,0.45)";
    ctx.beginPath(); ctx.arc(306, 38, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(294, 46, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(302, 48, 2, 0, Math.PI*2); ctx.fill();

    // ดาวระยิบ
    for(let i=0;i<30;i++){
      const sx = (i*47+13)%350 + 5;
      const sy = (i*23+7)%85 + 5;
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(Date.now()/400 + i));
      ctx.globalAlpha = tw;
      ctx.fillStyle = i%5===0 ? "#ffe082" : "#fff";
      const sz = i%4===0 ? 2.2 : 1;
      ctx.beginPath(); ctx.arc(sx, sy, sz, 0, Math.PI*2); ctx.fill();
      if(i%6===0){
        ctx.strokeStyle = "rgba(255,255,255,0.5)";
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(sx-4,sy); ctx.lineTo(sx+4,sy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx,sy-4); ctx.lineTo(sx,sy+4); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ฝน / ลม
  if(currentWeather===1){
    ctx.strokeStyle="rgba(200,220,255,0.55)"; ctx.lineWidth=1.5;
    for(let i=0;i<50;i++){
      const x=Math.random()*canvas.width, y=Math.random()*canvas.height;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-3,y+12); ctx.stroke();
    }
  }
  if(currentWeather===2){
    ctx.strokeStyle="rgba(255,255,255,0.28)"; ctx.lineWidth=2;
    for(let i=0;i<10;i++){
      const y=50+i*32;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.bezierCurveTo(90,y-10,200,y+10,360,y); ctx.stroke();
    }
  }
  if(currentWeather===3){
    // ออโรร่า แสงสีบนฟ้า
    const at = Date.now()/1200;
    for(let i=0;i<5;i++){
      const g = ctx.createLinearGradient(0, 0, 0, 120);
      const cols = [
        ["rgba(0,255,180,0.2)","rgba(80,120,255,0.08)","rgba(0,0,0,0)"],
        ["rgba(180,80,255,0.18)","rgba(0,200,255,0.08)","rgba(0,0,0,0)"],
        ["rgba(255,80,180,0.15)","rgba(100,255,200,0.06)","rgba(0,0,0,0)"]
      ][i%3];
      g.addColorStop(0, cols[0]);
      g.addColorStop(0.5, cols[1]);
      g.addColorStop(1, cols[2]);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-20+i*40, 0);
      for(let x=0;x<=canvas.width+40;x+=20){
        const y = 30 + Math.sin(x*0.02 + at + i)*18 + i*8;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(canvas.width+40, 0);
      ctx.closePath();
      ctx.fill();
    }
  }

  // คลื่นน้ำหลายชั้น
  for(let i=0;i<6;i++){
    ctx.strokeStyle = `rgba(255,255,255,${0.12 + i*0.03})`;
    ctx.lineWidth = 1.5 + (i%2);
    ctx.beginPath();
    ctx.moveTo(0, 80+i*45);
    ctx.quadraticCurveTo(canvas.width/2, 70+i*45 + Math.sin(i)*6, canvas.width, 80+i*45);
    ctx.stroke();
  }

  // ===== แสงเงาทั่วฉาก จัดเต็ม =====
  // ชั้นน้ำลึก (เงา)
  const depthG = ctx.createLinearGradient(0, 85, 0, canvas.height);
  depthG.addColorStop(0, "rgba(0,0,0,0)");
  depthG.addColorStop(0.25, isDay ? "rgba(0,30,50,0.06)" : "rgba(0,5,25,0.18)");
  depthG.addColorStop(0.55, isDay ? "rgba(0,20,40,0.16)" : "rgba(0,0,15,0.32)");
  depthG.addColorStop(1, isDay ? "rgba(0,5,20,0.38)" : "rgba(0,0,0,0.55)");
  ctx.fillStyle = depthG;
  ctx.fillRect(0, 85, canvas.width, canvas.height-85);

  // แสงสะท้อนผิวน้ำกว้าง
  const waterLight = ctx.createLinearGradient(0, 75, 0, 200);
  if(isDay){
    waterLight.addColorStop(0, "rgba(255,255,230,0.18)");
    waterLight.addColorStop(0.4, "rgba(200,230,255,0.08)");
    waterLight.addColorStop(1, "rgba(255,255,255,0)");
  } else {
    waterLight.addColorStop(0, "rgba(140,160,255,0.12)");
    waterLight.addColorStop(0.5, "rgba(80,100,180,0.05)");
    waterLight.addColorStop(1, "rgba(50,60,120,0)");
  }
  ctx.fillStyle = waterLight;
  ctx.fillRect(0, 75, canvas.width, 130);

  // ประกายน้ำ (caustics แบบง่าย)
  const t = Date.now()/900;
  ctx.strokeStyle = isDay ? "rgba(255,255,255,0.12)" : "rgba(150,180,255,0.1)";
  ctx.lineWidth = 1.5;
  for(let i=0;i<5;i++){
    ctx.beginPath();
    for(let x=0;x<=canvas.width;x+=12){
      const y = 110 + i*28 + Math.sin(x*0.04 + t + i)*4 + Math.cos(x*0.02 - t*0.7)*3;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  // แสงฟุ้งมุมบน (ตามทิศดวงอาทิตย์/จันทร์)
  const corner = ctx.createRadialGradient(300, 20, 10, 200, 80, 280);
  corner.addColorStop(0, isDay ? "rgba(255,240,180,0.15)" : "rgba(160,180,255,0.1)");
  corner.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = corner;
  ctx.fillRect(0, 0, canvas.width, 180);

  // เงาด้านข้าง (volume)
  const sideL = ctx.createLinearGradient(0, 0, 80, 0);
  sideL.addColorStop(0, isDay ? "rgba(0,0,0,0.1)" : "rgba(0,0,0,0.25)");
  sideL.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = sideL;
  ctx.fillRect(0, 0, 80, canvas.height);
  const sideR = ctx.createLinearGradient(canvas.width, 0, canvas.width-80, 0);
  sideR.addColorStop(0, isDay ? "rgba(0,0,0,0.1)" : "rgba(0,0,0,0.25)");
  sideR.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = sideR;
  ctx.fillRect(canvas.width-80, 0, 80, canvas.height);

  // vignette แรง
  const vig = ctx.createRadialGradient(canvas.width/2, canvas.height*0.42, 40, canvas.width/2, canvas.height*0.45, canvas.width*0.72);
  vig.addColorStop(0, "rgba(0,0,0,0)");
  vig.addColorStop(0.55, "rgba(0,0,0,0)");
  vig.addColorStop(1, isDay ? "rgba(0,0,0,0.22)" : "rgba(0,0,0,0.42)");
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // หมอกเบาๆ ขอบฟ้า
  const fog = ctx.createLinearGradient(0, 60, 0, 100);
  fog.addColorStop(0, isDay ? "rgba(255,255,255,0.06)" : "rgba(40,50,80,0.12)");
  fog.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = fog;
  ctx.fillRect(0, 60, canvas.width, 50);

  drawIslandBack(currentLoc);

  // ===== ตกแต่งสถานที่แบบละเอียด =====  // ===== ตกแต่งสถานที่แบบละเอียด =====
  if(currentLoc===0){ // ชายหาด - หาดทราย + ปู + นก
    ctx.fillStyle="rgba(255,224,178,0.35)";
    ctx.fillRect(0, 300, canvas.width, 60);
    ctx.fillStyle="#ffe0b2";
    ctx.beginPath(); ctx.ellipse(50, 310, 40, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="#ffcc80";
    ctx.beginPath(); ctx.arc(30, 305, 4, 0, Math.PI*2); ctx.fill();
    // นก
    ctx.strokeStyle="rgba(255,255,255,0.7)"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(250,40); ctx.quadraticCurveTo(260,35,270,40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(280,50); ctx.quadraticCurveTo(288,46,296,50); ctx.stroke();
  }
  if(currentLoc===1){ // เกาะลึกลับ
    ctx.fillStyle="#4e342e";
    ctx.beginPath(); ctx.ellipse(55, 100, 50, 20, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="#2e7d32";
    ctx.beginPath(); ctx.arc(40, 78, 18, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(65, 72, 15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(55, 65, 12, 0, Math.PI*2); ctx.fill();
    // ปะการัง
    ctx.fillStyle="#e91e63";
    ctx.beginPath(); ctx.moveTo(300,280); ctx.lineTo(295,250); ctx.lineTo(305,250); ctx.fill();
    ctx.fillStyle="#9c27b0";
    ctx.beginPath(); ctx.moveTo(320,290); ctx.lineTo(318,260); ctx.lineTo(325,260); ctx.fill();
  }
  if(currentLoc===2){ // ทะเลลึก
    ctx.fillStyle="rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(180, 220, 120, 50, 0, 0, Math.PI*2); ctx.fill();
    // ปลาเล็กเรืองแสง
    ctx.fillStyle="rgba(128,222,234,0.5)";
    for(let i=0;i<6;i++){
      ctx.beginPath(); ctx.arc(60+i*45, 150+Math.sin(i*2)*20, 3, 0, Math.PI*2); ctx.fill();
    }
  }
  if(currentLoc===3){ // เกาะลับ
    ctx.fillStyle="#6a1b9a";
    ctx.beginPath(); ctx.ellipse(70, 95, 55, 22, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="#ce93d8";
    ctx.beginPath(); ctx.arc(50, 75, 16, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(85, 70, 13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="rgba(206,147,216,0.35)";
    ctx.beginPath(); ctx.arc(70, 80, 45, 0, Math.PI*2); ctx.fill();
    // คริสตัล
    ctx.fillStyle="#e1bee7";
    ctx.beginPath(); ctx.moveTo(300,100); ctx.lineTo(295,70); ctx.lineTo(305,70); ctx.fill();
    ctx.beginPath(); ctx.moveTo(320,110); ctx.lineTo(315,75); ctx.lineTo(328,75); ctx.fill();
  }
  if(currentLoc===4){ // ซากใต้น้ำ
    ctx.fillStyle="#5d4037";
    ctx.beginPath(); ctx.ellipse(80, 105, 60, 24, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="#bf360c";
    ctx.beginPath(); ctx.arc(55, 88, 14, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(95, 85, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="rgba(255,87,34,0.4)";
    ctx.beginPath(); ctx.arc(75, 90, 40, 0, Math.PI*2); ctx.fill();
    // เสาโบราณ
    ctx.fillStyle="rgba(93,64,55,0.75)";
    ctx.fillRect(275, 65, 14, 55);
    ctx.fillRect(300, 50, 12, 70);
    ctx.fillRect(320, 70, 10, 50);
    // ประกายลาวา
    ctx.fillStyle="#ffab40";
    for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(50+i*20, 70+Math.random()*30, 2, 0, Math.PI*2); ctx.fill(); }
  }
  if(currentLoc===5){ // บึงลึกลับ
    ctx.fillStyle="#2e7d32";
    ctx.beginPath(); ctx.arc(45, 72, 20, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(70, 65, 16, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(55, 58, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="#5d4037"; ctx.fillRect(52, 85, 10, 30);
    // ใบบัวหลายใบ
    ctx.fillStyle="#81c784";

    ctx.fillStyle = isBlue ? "#00e5ff" : "#ff1744";
    ctx.fillRect(hx-2, 40, 4, 4);

  } else if(rodId===39){
    // 🎡 วงล้อสุ่ม
    const hy=12;
    ctx.strokeStyle=rc.rod; ctx.lineWidth=5; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(hx, 36); ctx.lineTo(hx, hy+8); ctx.stroke();
    // วงล้อ
    const t=Date.now()/300;
    for(let i=0;i<8;i++){
      const a=t+i*Math.PI/4;
      const cols=["#e91e63","#ffeb3b","#00e676","#2979ff","#d500f9","#ff6d00","#00e5ff","#ff1744"];
      ctx.strokeStyle=cols[i]; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx+Math.cos(a)*12, hy+Math.sin(a)*12); ctx.stroke();
    }
    ctx.strokeStyle="#fff"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(hx, hy, 3, 0, Math.PI*2); ctx.fill();
  } else {
    // เบ็ดทั่วไป: ด้าม+ที่จับ+รอก+ปลาย
    // ด้ามหลัก
    ctx.strokeStyle = rc.rod;
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(hx,36); ctx.lineTo(hx,10); ctx.stroke();
    // ที่จับล่าง
    ctx.strokeStyle = rc.hook || rc.rod;
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(hx,36); ctx.lineTo(hx,30); ctx.stroke();
    // แถบลาย
    ctx.strokeStyle = rc.line || "#fff";
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.7;
    for(let y of [28,24,20,16]){
      ctx.beginPath(); ctx.moveTo(hx-3,y); ctx.lineTo(hx+3,y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // รอกเล็ก
    ctx.fillStyle = rc.hook || rc.rod;
    ctx.beginPath(); ctx.arc(hx+5, 26, 4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(hx+5, 26, 2, 0, Math.PI*2); ctx.stroke();
    // ปลายคัน
    ctx.fillStyle = rc.hook || rc.rod;
    ctx.beginPath(); ctx.arc(hx, 10, 3.5, 0, Math.PI*2); ctx.fill();
    if(rc.glow){
      ctx.fillStyle = rc.glow;
      ctx.globalAlpha = 0.4;
      ctx.beginPath(); ctx.arc(hx, 10, 7, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // สายเบ็ด
  ctx.strokeStyle = rc.line || "#90caf9";
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(hx, (rodId>=28&&rodId<=31)||rodId===26||rodId===40||rodId===41||rodId===42||rodId===43||rodId===44||rodId===45||rodId===46||rodId===47||rodId===48||rodId===39 ? ((rodId===31)?12:10) : 10); ctx.lineTo(hx, hookY); ctx.stroke();

  // ตะขอเบ็ด (สวยขึ้น)
  if(currentRod!==28 && currentRod!==29 && currentRod!==30 && currentRod!==31 && rc.glow){
    ctx.strokeStyle = rc.glow;
    ctx.lineWidth = 5;
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(boatX+14, hookY+8, 8, 0, Math.PI*1.5); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = rc.hook;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(boatX+14, hookY+8, 7, 0, Math.PI*1.5); ctx.stroke();
  // เงาที่ตะขอ
  ctx.fillStyle = rc.glow || "#fff";
  ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.arc(boatX+14, hookY+6, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.lineCap = "butt";
  drawIslandLight(currentLoc);
  if(window.mpDrawFriends) mpDrawFriends();
}

function startCast(){
  if(fishingState==="castAim"){
    // ปล่อยจากกดค้าง = เหวี่ยง
    return;
  }
  if(fishingState!=="idle")return;
  if(currentLoc===10){
    openEnchantPanel();
    return;
  }
  if(getTotalFish()>=maxBag){showMessage(msg("กระเป๋าเต็ม!\nไปขายปลาก่อน","Bag full!\nSell fish first"),2000);return}
  if(baits[currentBait].owned<=0&&currentBait!==0){showMessage(msg("เหยื่อหมดแล้ว!","Out of bait!"),1600);return}

  // แบบ Fisch: กดค้างเติมแรง ปล่อยเพื่อเหวี่ยง
  fishingState="castAim";
  castPos=0; castDir=1; castSpeed=2.4;
  castBtn.textContent=msg("ปล่อยเพื่อเหวี่ยง!","Release to cast!");
  const castUI=document.getElementById("castUI");
  const castMarker=document.getElementById("castMarker");
  const castZone=document.getElementById("castZone");
  const castHint=document.getElementById("castHint");
  const castTitle=document.getElementById("castTitle");
  if(castUI) castUI.style.display="block";
  if(castTitle) castTitle.textContent=msg("แรงเหวี่ยง (กดค้าง)","Cast power (hold)");
  if(castHint) castHint.textContent=msg("กดค้างให้แถบแดงอยู่ในโซนเหลือง แล้วปล่อย!","Hold so the red bar is in the yellow zone, then release!");
  if(castZone){ castZone.style.left="38%"; castZone.style.width="24%"; }

  if(castTimer) clearInterval(castTimer);
  castTimer=setInterval(()=>{
    if(fishingState!=="castAim"){ clearInterval(castTimer); return; }
    castPos += castDir * castSpeed;
    if(castPos>=100){ castPos=100; castDir=-1; }
    if(castPos<=0){ castPos=0; castDir=1; }
    if(castMarker) castMarker.style.left = castPos + "%";
  }, 25);
}

function releaseCast(){
  if(fishingState!=="castAim") return;
  if(castTimer){ clearInterval(castTimer); castTimer=null; }
  const castUI=document.getElementById("castUI");
  if(castUI) castUI.style.display="none";

  const zoneL=38, zoneR=62;
  let quality=0;
  if(castPos>=zoneL && castPos<=zoneR){
    const mid=50;
    const dist=Math.abs(castPos-mid);
    quality = Math.max(0.6, Math.min(1, 1 - dist/14));
    showMessage(msg("เหวี่ยงดี! "+Math.round(quality*100)+"%","Nice cast! "+Math.round(quality*100)+"%"), 1100);
    SFX.reel();
  } else {
    const dist=castPos<zoneL ? (zoneL-castPos) : (castPos-zoneR);
    quality = Math.max(0.2, 0.55 - dist/70);
    showMessage(msg("เหวี่ยงไม่ตรงจังหวะ "+Math.round(quality*100)+"%","Off timing "+Math.round(quality*100)+"%"), 1100);
    SFX.fail();
  }
  castQuality = quality;

  SFX.cast();
  fishingState="casting";
  castBtn.disabled=true;
  castBtn.textContent=msg("กำลังเหวี่ยง...","Casting...");

  let drop=setInterval(()=>{
    hookY+=10;
    if(hookY>260){
      clearInterval(drop);
      fishingState="waiting";
      castBtn.textContent=msg("รอปลากิน...","Waiting...");
      showMessage(msg("รอปลากินเหยื่อ...","Waiting for a bite..."),1400);
      const wait = (2200 - castQuality*900) + Math.random()*1600;
      biteTimeout=setTimeout(startBite, Math.max(700, wait));
    }
    draw();
  },25);
}

function finishCastAim(){ releaseCast(); }

// เก็บปลาที่กำลังกัดเบ็ดไว้
let pendingFish = null;
let isBossFight = false;


function getActiveRodStats(){
  const r = rods[currentRod] || rods[0];
  const en = rodEnchants[currentRod];
  return {
    luck: (r.luck||0) + (en ? (en.luck||0) : 0),
    reel: (r.reel||5) + (en ? (en.reel||0) : 0),
    mult: (r.mult||1) * (1 + (en ? (en.mult||0) : 0)),
    maxWeight: r.maxWeight||50,
    name: r.name
  };
}

function startBite(){
  fishingState="biting";
  pendingFish = null;
  isBossFight = false;
  isFightingMega = false;

  const loc = locations[currentLoc];
  const weather = weathers[currentWeather];

  // สุ่มว่าเป็นบอสหรือไม่
  // เกาะโบราณ (index 8) ตกเมกาโลดอนได้แม้กิจกรรมยังไม่เริ่ม
  if((megaEventActive && Math.random() < 0.01) || (currentLoc === 8 && Math.random() < 0.18)){
    const megaPrice = Math.floor(50000 + Math.random() * 450000);
    pendingFish = {name:"ฉลามเมกาโลดอน",rarity:"บอส",price:megaPrice,exp:Math.floor(megaPrice/40),chance:0};
    isFightingMega = true;
    isBossFight = true;
  } else if(Math.random()*100 < (2.8 * weather.bossChance) && loc.fish.some(f=>f.rarity==="บอส")){
    const bosses = loc.fish.filter(f=>f.rarity==="บอส");
    pendingFish = bosses[Math.floor(Math.random()*bosses.length)];
    isBossFight = true;
  } else {
    // เลือกปลาล่วงหน้า เพื่อคำนวณแรงดึงตามน้ำหนัก
    const rod=rods[currentRod], bait=baits[currentBait];
    let adjusted=loc.fish.filter(f=>f.rarity!=="บอส").map(f=>{
      let ch=f.chance;
      if(f.rarity!=="ธรรมดา"){ const _rs=getActiveRodStats(); ch+=_rs.luck+bait.rareBonus+weather.rareBonus+(isDay?0:5)+(castQuality>0.7?castQuality*6:0); ch=Math.max(0.1,ch); }
      return {...f,chance:ch};
    });
    const total=adjusted.reduce((s,f)=>s+f.chance,0)||1;
    adjusted=adjusted.map(f=>({...f,chance:(f.chance/total)*100}));
    const rand=Math.random()*100;let cum=0;
    for(let f of adjusted){cum+=f.chance;if(rand<=cum){pendingFish=f;break}}
    if(!pendingFish && adjusted.length) pendingFish=adjusted[0];
  }

  // ประมาณน้ำหนักเพื่อกำหนดแรงดึง
  const sizeEst=0.7+Math.random()*0.9;
  if(pendingFish){
    if(pendingFish.name==="ฉลามเมกาโลดอน") fightWeightEst = 10000 + Math.random()*40000;
    else if(pendingFish.rarity==="บอส") fightWeightEst = Math.max((pendingFish.price||5000)/8*sizeEst, 5000*sizeEst);
    else if(pendingFish.rarity==="ตำนาน") fightWeightEst = Math.max((pendingFish.price||500)/8*sizeEst, 800*sizeEst);
    else if(pendingFish.rarity==="มหากาพย์") fightWeightEst = Math.max((pendingFish.price||200)/10*sizeEst, 200*sizeEst);
    else if(pendingFish.rarity==="หายาก") fightWeightEst = Math.max((pendingFish.price||50)/10*sizeEst, 40*sizeEst);
    else fightWeightEst = Math.max((pendingFish.price||10)/10*sizeEst, 5*sizeEst);
  } else {
    fightWeightEst = 10;
  }

  // แรงดึงตามน้ำหนัก + ค่ารีลของเบ็ด (reel สูง = ดึงง่ายขึ้น)
  // ค่ารีลช่วยได้บ้าง แต่ไม่ง่ายเกิน (เบ็ดดีช่วยเล็กน้อย)
  const rodReel = getActiveRodStats().reel;
  const reelBoost = 1 + (rodReel / 140);  // max ~1.71 ที่ reel 100
  const reelEase = 1 + (rodReel / 180);   // max ~1.56 ที่ reel 100

  if(isFightingMega){
    const w = Math.max(10000, fightWeightEst);
    const megaFactor = Math.min(1, (w - 10000) / 40000);
    currentDrainSpeed = (5.2 + megaFactor * 2.6) / reelEase;
    currentReelAdd = (2.4 - megaFactor * 1.0) * reelBoost;
    reelProgress = Math.max(5, 9 - megaFactor * 4);
  } else if(isBossFight){
    const w = Math.max(1000, fightWeightEst);
    const bossFactor = Math.min(1, Math.log10(w) / 5);
    currentDrainSpeed = (4.5 + bossFactor * 1.3) / reelEase;
    currentReelAdd = (2.5 - bossFactor * 0.4) * reelBoost;
    reelProgress = 7;
  } else {
    const w = Math.max(1, fightWeightEst);
    const weightFactor = Math.min(4.5, Math.log10(w + 10) * 1.15);
    currentDrainSpeed = (1.35 + weightFactor * 0.75) / reelEase;
    currentReelAdd = Math.max(2.4, (9.8 - weightFactor * 1.55) * reelBoost);
    reelProgress = Math.max(10, 26 - weightFactor * 3);
  }
  currentDrainSpeed = Math.max(0.9, currentDrainSpeed);
  currentReelAdd = Math.min(12, Math.max(1.4, currentReelAdd));
  reelProgress = Math.min(32, Math.max(5, reelProgress));
  // เหวี่ยงดี → เริ่มหลอดสูงขึ้นเล็กน้อย
  reelProgress = Math.min(40, reelProgress + castQuality * 10);


  if(isBossFight && pendingFish){
    biteText.textContent = "🔥 " + tn(pendingFish.name) + (currentLang==="en" ? " is biting!!!" : " กินแล้ว!!!");
    biteText.style.color = "#ff1744";
    SFX.bossBite();
  } else {
    biteText.textContent = currentLang==="en" ? "Fish is biting!!!" : "ปลากินแล้ว!!!";
    biteText.style.color = "#ffeb3b";
    SFX.bite();
  }

  fishingUI.style.display="block";
  reelBtn.style.display="block";
  reelBar.style.width = reelProgress + "%";
  castBtn.textContent = t("pullFish");
  if(timingHint){
    timingHint.textContent = currentLang==="en"
      ? "Tap the button to fill the bar!"
      : "กดปุ่มดึงเพื่อเติมหลอด!";
  }
  // ซ่อนแถบตามปลา (ระบบเดิมไม่ใช้)
  const track=document.getElementById("timingTrack");
  if(track) track.style.display="none";

  startRodSkills();

  if(timingTimer){ clearInterval(timingTimer); timingTimer=null; }
  isHoldingReel=false;

  // ปลาไม่หลุดเองตามเวลา — หลุดเมื่อหลอดหมด หรือจับได้เมื่อหลอดเต็ม
  reelTimer = setInterval(()=>{
    reelProgress = Math.max(0, reelProgress - currentDrainSpeed);
    reelBar.style.width = reelProgress + "%";
    if(reelProgress <= 0){
      clearInterval(reelTimer);
      failCatch();
    }
  }, 100);
}

function doReel(){
  if(fishingState !== "biting") return;
  SFX.reel();
  const addAmount = currentReelAdd || 8.5;
  reelProgress = Math.min(100, reelProgress + addAmount);
  reelBar.style.width = reelProgress + "%";
  if(reelProgress >= 100){
    clearInterval(reelTimer);
    if(timingTimer){ clearInterval(timingTimer); timingTimer=null; }
    successCatch();
  }
}
function releaseReel(){
  isHoldingReel = false;
}

function flashReelSkill(type, label){
  const bg = document.getElementById('reelBarBg');
  const layer = document.getElementById('skillFxLayer');
  if(!bg) return;
  bg.classList.remove('fx-hammer','fx-trident','fx-void','fx-sun');
  void bg.offsetWidth; // restart anim
  bg.classList.add('fx-'+type);
  if(layer){
    layer.innerHTML = '<span class="skill-pop">'+label+'</span>';
  }
  setTimeout(()=>{
    bg.classList.remove('fx-hammer','fx-trident','fx-void','fx-sun');
  }, 450);
}

function fireHammerSmash(){
  let hammer = document.getElementById('hammerDrop');
  let impact = document.getElementById('hammerImpact');
  const bg = document.getElementById('reelBarBg');
  if(!hammer){
    hammer = document.createElement('div');
    hammer.id = 'hammerDrop';
    document.body.appendChild(hammer);
  }
  // โมเดลค้อน (หัว + ด้าม + ด้ามจับ)
  hammer.innerHTML = '<div class="h-head"><div class="h-face"></div></div><div class="h-handle"></div><div class="h-grip"></div>';
  if(!impact){
    impact = document.createElement('div');
    impact.id = 'hammerImpact';
    document.body.appendChild(impact);
  }
  if(hammer.parentElement !== document.body) document.body.appendChild(hammer);
  if(impact.parentElement !== document.body) document.body.appendChild(impact);

  // ตำแหน่งกระทบ = กลางหลอดดึง
  let impactLeft = window.innerWidth * 0.5;
  let impactTop = window.innerHeight * 0.75;
  if(bg){
    const rect = bg.getBoundingClientRect();
    impactLeft = rect.left + rect.width/2;
    impactTop = rect.top + rect.height * 0.3;
  }
  impact.style.left = impactLeft + 'px';
  impact.style.top = impactTop + 'px';
  impact.style.marginLeft = '0';
  impact.style.transform = 'translateX(-50%)';

  // ค้อนเหวี่ยงจากขวา (animation ใช้ right)
  hammer.style.left = 'auto';
  hammer.style.right = '-40px';
  hammer.style.top = '18%';
  hammer.style.bottom = 'auto';
  hammer.style.display = 'block';
  hammer.style.animation = 'none';
  void hammer.offsetWidth;
  hammer.style.animation = 'hammerSwing .6s cubic-bezier(.25,.8,.3,1.05) forwards';

  setTimeout(()=>{
    impact.style.display = 'block';
    impact.style.animation = 'none';
    void impact.offsetWidth;
    impact.style.animation = 'hammerImpactFx .4s ease-out forwards';
    if(bg){
      bg.classList.remove('fx-hammer');
      void bg.offsetWidth;
      bg.classList.add('fx-hammer');
      setTimeout(()=>bg.classList.remove('fx-hammer'), 450);
    }
    SFX.hammer();
  }, 380);

  setTimeout(()=>{
    hammer.style.display = 'none';
    impact.style.display = 'none';
  }, 700);
}

function drawMiniRod(c, type){
  const cx = 18, H = 52;
  c.clearRect(0,0,36,52);
  if(type===0){ // Wooden
    c.strokeStyle="#8d6e63"; c.lineWidth=4; c.lineCap="round";
    c.beginPath(); c.moveTo(cx,8); c.lineTo(cx,H-6); c.stroke();
    c.fillStyle="#a1887f"; c.beginPath(); c.arc(cx,8,3,0,Math.PI*2); c.fill();
  } else if(type===1){ // Astralhook
    c.strokeStyle="#ffd700"; c.lineWidth=2;
    c.beginPath(); c.arc(cx,14,8,0,Math.PI*2); c.stroke();
    c.fillStyle="#1a237e"; c.beginPath(); c.arc(cx,14,4,0,Math.PI*2); c.fill();
    c.fillStyle="#ffd700"; c.beginPath(); c.arc(cx+4,8,5,-0.8,2.5); c.fill();
    c.fillStyle="#ffc107"; for(let i=0;i<4;i++) c.fillRect(cx-2,24+i*4,4,3);
  } else if(type===2){ // Sun
    c.fillStyle="#ff6d00"; c.beginPath(); c.arc(cx,16,8,0,Math.PI*2); c.fill();
    c.fillStyle="#ffeb3b"; c.beginPath(); c.arc(cx,16,5,0,Math.PI*2); c.fill();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      c.strokeStyle="#ffab40"; c.lineWidth=2;
      c.beginPath(); c.moveTo(cx+Math.cos(a)*8,16+Math.sin(a)*8); c.lineTo(cx+Math.cos(a)*12,16+Math.sin(a)*12); c.stroke();
    }
    c.strokeStyle="#e65100"; c.lineWidth=3; c.beginPath(); c.moveTo(cx,24); c.lineTo(cx,H-6); c.stroke();
  } else if(type===3){ // Seraphic
    c.fillStyle="rgba(255,255,255,0.85)";
    c.beginPath(); c.ellipse(cx-8,14,7,4,-0.3,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(cx+8,14,7,4,0.3,0,Math.PI*2); c.fill();
    c.strokeStyle="#ffd700"; c.lineWidth=2.5; c.lineCap="round";
    c.beginPath(); c.moveTo(cx-6,8); c.lineTo(cx+6,18); c.stroke();
    c.beginPath(); c.moveTo(cx+6,8); c.lineTo(cx-6,18); c.stroke();
    c.fillStyle="#e53935"; c.beginPath(); c.arc(cx,13,2,0,Math.PI*2); c.fill();
    c.strokeStyle="#b0bec5"; c.lineWidth=2; c.beginPath(); c.moveTo(cx,20); c.lineTo(cx,H-6); c.stroke();
  } else if(type===4){ // Cerulean Fang
    c.strokeStyle="#1565c0"; c.lineWidth=3; c.lineCap="round";
    c.beginPath(); c.moveTo(cx,H-6); c.quadraticCurveTo(cx+10,28,cx+2,8); c.stroke();
    c.strokeStyle="#40c4ff"; c.lineWidth=1.5;
    c.beginPath(); c.moveTo(cx-1,H-8); c.quadraticCurveTo(cx+8,28,cx+1,10); c.stroke();
    c.fillStyle="#e1f5fe"; c.beginPath(); c.moveTo(cx+2,8); c.lineTo(cx+8,4); c.lineTo(cx,12); c.fill();
  } else if(type===5){ // Wicked Fang
    c.strokeStyle="#b71c1c"; c.lineWidth=3; c.lineCap="round";
    c.beginPath(); c.moveTo(cx,H-6); c.quadraticCurveTo(cx-10,28,cx-2,8); c.stroke();
    c.strokeStyle="#ff1744"; c.lineWidth=1.5;
    c.beginPath(); c.moveTo(cx+1,H-8); c.quadraticCurveTo(cx-8,28,cx-1,10); c.stroke();
    c.fillStyle="#ff8a80"; c.beginPath(); c.moveTo(cx-2,8); c.lineTo(cx-8,4); c.lineTo(cx,12); c.fill();
  } else if(type===6){ // Luminescent Oath
    const g=c.createLinearGradient(cx,6,cx,H-8);
    g.addColorStop(0,"#fff"); g.addColorStop(0.5,"#40c4ff"); g.addColorStop(1,"#0277bd");
    c.fillStyle=g;
    c.beginPath(); c.moveTo(cx-2,8); c.lineTo(cx+2,8); c.lineTo(cx+2,H-18); c.lineTo(cx,H-12); c.lineTo(cx-2,H-18); c.fill();
    c.fillStyle="#40c4ff"; c.beginPath(); c.arc(cx,H-16,3,0,Math.PI*2); c.fill();
    c.fillStyle="#263238"; c.fillRect(cx-1.5,H-14,3,8);
  } else if(type===7){ // Ruinous Oath
    const g=c.createLinearGradient(cx,6,cx,H-8);
    g.addColorStop(0,"#fff8e1"); g.addColorStop(0.5,"#ff1744"); g.addColorStop(1,"#b71c1c");
    c.fillStyle=g;
    c.beginPath(); c.moveTo(cx-2,8); c.lineTo(cx+2,8); c.lineTo(cx+2,H-18); c.lineTo(cx,H-12); c.lineTo(cx-2,H-18); c.fill();
    c.fillStyle="#ff1744"; c.beginPath(); c.arc(cx,H-16,3,0,Math.PI*2); c.fill();
    c.fillStyle="#212121"; c.fillRect(cx-1.5,H-14,3,8);
  } else if(type===8){ // Forgotten Fang
    c.strokeStyle="#eceff1"; c.lineWidth=3; c.lineCap="round";
    c.beginPath(); c.moveTo(cx,H-6); c.quadraticCurveTo(cx+8,28,cx+1,8); c.stroke();
    c.fillStyle="#cfd8dc";
    for(let i=0;i<3;i++){ const yy=H-16-i*8; c.beginPath(); c.moveTo(cx+2,yy); c.lineTo(cx+9,yy-3); c.lineTo(cx+3,yy+3); c.fill(); }
    c.strokeStyle="#00e5ff"; c.lineWidth=1.2;
    c.beginPath(); c.moveTo(cx-5,12); c.lineTo(cx-1,22); c.lineTo(cx-6,24); c.stroke();
  } else if(type===9){ // No-Life Key
    c.strokeStyle="#c62828"; c.lineWidth=2.5;
    c.beginPath(); c.arc(cx,14,8,0,Math.PI*2); c.stroke();
    c.strokeStyle="#1a0000"; c.lineWidth=1.5;
    c.beginPath(); c.arc(cx-2,12,3.5,0.3,4); c.stroke();
    c.fillStyle="#ff1744"; c.beginPath(); c.arc(cx+3,12,2,0,Math.PI*2); c.fill();
    c.strokeStyle="#c62828"; c.lineWidth=2.5; c.beginPath(); c.moveTo(cx+6,16); c.lineTo(cx+2,H-8); c.stroke();
    c.fillStyle="#e53935"; c.fillRect(cx,H-12,8,2); c.fillRect(cx+5,H-12,2,6);
  }
}

function drawMiniZenith(c){
  const cx = 24;
  // ใบดาบ
  c.fillStyle = "#283593";
  c.fillRect(cx-7, 10, 14, 36);
  c.fillStyle = "#3949ab";
  c.beginPath(); c.moveTo(cx-7,10); c.lineTo(cx,2); c.lineTo(cx+7,10); c.closePath(); c.fill();
  c.strokeStyle = "#f8bbd0"; c.lineWidth = 2;
  c.strokeRect(cx-7,10,14,36);
  c.strokeStyle = "#f48fb1"; c.lineWidth = 1.8;
  for(let i=0;i<3;i++){
    const yy = 14+i*9;
    c.beginPath(); c.moveTo(cx-5,yy+5); c.lineTo(cx,yy); c.lineTo(cx+5,yy+5); c.stroke();
  }
  // การ์ดตา
  c.fillStyle = "#c5e1a5";
  c.beginPath(); c.moveTo(cx-14,46); c.lineTo(cx+14,46); c.lineTo(cx+12,58); c.lineTo(cx-12,58); c.closePath(); c.fill();
  c.fillStyle = "#81c784"; c.beginPath(); c.arc(cx,52,9,0,Math.PI*2); c.fill();
  c.fillStyle = "#fff59d"; c.beginPath(); c.arc(cx,52,6,0,Math.PI*2); c.fill();
  c.fillStyle = "#6a1b9a"; c.beginPath(); c.arc(cx,52,3.5,0,Math.PI*2); c.fill();

  skillTimers.forEach(t=>clearInterval(t));
  skillTimers=[];

  if(skillFxAnim){ clearInterval(skillFxAnim); skillFxAnim=null; }
  const bg=document.getElementById('reelBarBg');

function startRodSkills(){

    if(skillFx.hammer>0) skillFx.hammer--;
    if(skillFx.trident>0) skillFx.trident--;
    if(skillFx.void>0) skillFx.void--;
    if(fishingState==="biting") draw();
  }, 50);

  if(currentRod===29){
    // ค้อนฟ้า Lv500: ทุก 2 วิ +30%
    const t=setInterval(()=>{
      if(fishingState!=="biting") return clearRodSkills();
      reelProgress=Math.min(100, reelProgress+30);
      reelBar.style.width=reelProgress+"%";
      skillFx.hammer=15;
      fireHammerSmash();
      flashReelSkill('hammer', msg('🔨 ค้อนทุบ! +30%','🔨 HAMMER! +30%'));
      showMessage(msg("🔨 ค้อนฟ้าทุบหลอด! +30%","🔨 Blue Hammer smash! +30%"), 900);

    }, 2000);

      if(reelProgress>=100){ clearInterval(reelTimer); successCatch(); }
